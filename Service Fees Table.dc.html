const FILTERS = {
  fridge: ['fridge','sxs'],
  washers: ['washers','tower'],
  tv: ['tv'],
  ac: ['ac'],
  ht: ['ht'],
  mw: ['mw'],
  cook: ['cook'],
  vac: ['vac'],
  builtin: ['builtin'],
  audio: ['audio'],
  tower: ['tower','washers'],
  sxs: ['sxs','fridge']
};

class Component extends DCLogic {
  state = { hash: (typeof location !== 'undefined' ? location.hash.replace('#','') : '') };
  componentDidMount() {
    this._h = () => this.setState({ hash: location.hash.replace('#','') });
    window.addEventListener('hashchange', this._h);
  }
  componentWillUnmount() { window.removeEventListener('hashchange', this._h); }
  renderVals() {
    const keys = FILTERS[this.state.hash];
    const list = keys ? G.filter(g => keys.indexOf(g.id) > -1) : G;
    const filtered = !!keys;
    return { pageBack: () => { if (history.length > 1) history.back(); else location.href = 'index.html'; },
      isFiltered: filtered,
      filterLabel: filtered ? list[0].title : '',
      showAll: () => { location.hash = ''; this.setState({ hash: '' }); window.scrollTo(0, 0); },
      jump: (filtered ? [] : G).map(g => ({ href: '#' + g.id, label: g.title })),
      groups: list.map(g => ({
        id: g.id,
        title: g.title,
        tag: g.tag,
        hasNotes: !!(g.notes && g.notes.length),
        notes: g.notes || [],
        rows: g.rows.map(r => ({
          name: r[0], am: r[1], pm: r[2],
          style: 'display:grid;grid-template-columns:1fr 110px 110px;gap:8px;padding:12px 14px;border-radius:9px;background:'
            + (/زيارة فقط/.test(r[0]) ? '#fff5f7;border:1px solid #f0c2ce;' : '#fbfaf7;border:1px solid #e9e6de;')
            + 'font-size:14.5px;line-height:1.6;align-items:center;'
        }))
      }))
    };
  }
}
