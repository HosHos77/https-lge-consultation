<script>
(function(){
  var KEY = 'csGuideAuth_v1';
  var USER = 'agent';
  var PASS = 'LGE@2026';
  function authed(){ try { return localStorage.getItem(KEY) === '1'; } catch(e){ return false; } }
  if (authed()) return;
  document.addEventListener('DOMContentLoaded', function(){
    var box = document.createElement('div');
    box.style.cssText = 'position:fixed;inset:0;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:Tahoma,Arial,sans-serif;z-index:2147483647;';
    box.innerHTML =
      '<div style="background:#1c1c1c;padding:32px 40px;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.4);text-align:center;min-width:260px;">' +
      '<h2 style="margin:0 0 16px;font-size:18px;">تسجيل الدخول</h2>' +
      '<input id="csu" placeholder="اسم المستخدم" style="display:block;margin:8px auto;padding:9px 10px;width:220px;border-radius:5px;border:1px solid #444;background:#2a2a2a;color:#fff;">' +
      '<input id="csp" type="password" placeholder="الباسورد" style="display:block;margin:8px auto;padding:9px 10px;width:220px;border-radius:5px;border:1px solid #444;background:#2a2a2a;color:#fff;">' +
      '<button id="csb" style="margin-top:10px;padding:9px 26px;border:none;border-radius:5px;background:#e11d2e;color:#fff;cursor:pointer;font-size:14px;">دخول</button>' +
      '<div id="cse" style="color:#ff6b6b;margin-top:10px;font-size:13px;min-height:16px;"></div>' +
      '</div>';
    document.documentElement.appendChild(box);
    function tryLogin(){
      var u = document.getElementById('csu').value;
      var p = document.getElementById('csp').value;
      if (u === USER && p === PASS) {
        try { localStorage.setItem(KEY, '1'); } catch(e){}
        box.remove();
      } else {
        document.getElementById('cse').textContent = 'بيانات غير صحيحة';
      }
    }
    document.getElementById('csb').onclick = tryLogin;
    box.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') tryLogin(); });
    document.getElementById('csu').focus();
  });
})();
</script>

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from

    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to

    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's

    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      // and sender identity (own child frame / direct parent) is checked
      // separately.

    const blobUrls = {};

      // root's never-relay rule) are what hold in fully opaque chains

      // as real-vs-'null' rather than matching.

    for (const uuid of uuids) {

    // would push the parser into quirks mode. DOMParser always emits a <head>

    // attributes through, so match the full opening tag. slice() rather than

    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');

        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

yle: normal;\n  font-weight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"8ec00d65-63c4-4a8b-a61f-f08571312759\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek */\n@font-face {\n  font-family: 'IBM Plex Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"c60e508b-5cd4-4e2c-9c88-dfca736fd663\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'IBM Plex Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"210ef73f-bf84-4de6-b6df-194572d01aa0\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'IBM Plex Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"b983a254-a5cd-4b37-aa7c-ef497535270e\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'IBM Plex Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"d7acaa1f-2405-4a45-917c-b09fb5d5449a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  body { margin: 0; background: #f4f3ef; }\n  a { color: #A50034; text-decoration: underline; text-underline-offset: 3px; }\n  a:hover { color: #7A0027; }\n  @keyframes cardIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div dir=\"ltr\" style=\"min-height:100vh;background:#f4f3ef;color:#191a1c;font-family:'IBM Plex Sans',system-ui,sans-serif;\">\n\n  <div style=\"position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 28px;background:#111314;color:#f4f3ef;\">\n    <div style=\"display:flex;align-items:center;gap:14px;\">\n      <div style=\"width:10px;height:34px;border-radius:2px;background:#A50034;\"><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:2px;\">\n        <div style=\"font-family:'Cairo',sans-serif;font-weight:700;font-size:19px;line-height:1.2;\">Split AC Installation — Call Guide<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#9ea4a8;\">Step-by-step script for the agent during the call<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:10px;\">\n      <button sc-camel-on-click=\"{{ openNoCap }}\" style=\"padding:8px 14px;border-radius:8px;border:1px solid #3a4043;background:transparent;color:#f0a8bd;font-family:'IBM Plex Sans',sans-serif;font-size:13px;cursor:pointer;white-space:nowrap;\" style-hover=\"background:#22282a;\">No capacity?<\u002Fbutton>\n      <a href=\"ac-guide.html\" style=\"padding:8px 14px;border-radius:8px;border:1px solid #3a4043;color:#f0a8bd;font-size:13px;text-decoration:none;\" style-hover=\"background:#22282a;\">العربية<\u002Fa>\n      <div style=\"padding:7px 14px;border-radius:999px;background:#1e2224;font-size:12.5px;color:#c8cdd0;font-variant-numeric:tabular-nums;\">Step {{ stepNo }}<\u002Fdiv>\n      <button sc-camel-on-click=\"{{ toggleMap }}\" style=\"padding:8px 16px;border-radius:8px;border:1px solid #3a4043;background:transparent;color:#e4e7e9;font-family:'IBM Plex Sans',sans-serif;font-size:13px;cursor:pointer;white-space:nowrap;\" style-hover=\"background:#22282a;\">Full map<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ restart }}\" style=\"padding:8px 16px;border-radius:8px;border:none;background:#A50034;color:#ffffff;font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;\" style-hover=\"background:#C4004A;\">Start over<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1240px;margin:0 auto;padding:26px 28px 64px;display:grid;grid-template-columns:1fr 320px;gap:26px;align-items:start;\">\n\n    <div style=\"display:flex;flex-direction:column;gap:18px;min-width:0;\">\n\n      <sc-if value=\"{{ isStart }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"background:#fff;border:1px solid #e3e0d8;border-radius:14px;padding:34px 32px;animation:cardIn .25s ease;\">\n          <div style=\"font-family:'Cairo',sans-serif;font-weight:900;font-size:30px;line-height:1.35;margin:0 0 12px;\">Which service does the customer need?<\u002Fdiv>\n          <p style=\"margin:0 0 26px;font-size:16px;line-height:1.9;color:#4c5155;max-width:62ch;text-wrap:pretty;\">Pick the service to start the flow — each step shows exactly what to say to the customer and what to log.<\u002Fp>\n          <div style=\"margin-bottom:24px;padding:18px 22px;border-radius:12px;background:#fff5f7;border:1px solid #f0c2ce;font-size:15.5px;line-height:1.95;\"><strong style=\"color:#A50034;\">Before anything else:<\u002Fstrong> confirm with the customer that the unit is an <strong>LG unit<\u002Fstrong> — if it is not LG, <strong>end the call<\u002Fstrong>.<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;\">\n            <button sc-camel-on-click=\"{{ startInstall }}\" style=\"text-align:left;padding:22px;border-radius:12px;border:1px solid #d9d5cb;background:#fbfaf7;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-size:14px;color:#6b7075;line-height:1.7;\" style-hover=\"border-color:#A50034;background:#fdf5f7;\"><strong style=\"font-family:'Cairo',sans-serif;font-size:18px;color:#191a1c;display:block;margin-bottom:5px;\">AC installation<\u002Fstrong>Customer bought a new AC and wants it installed<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ startInspection }}\" style=\"text-align:left;padding:22px;border-radius:12px;border:1px solid #d9d5cb;background:#fbfaf7;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-size:14px;color:#6b7075;line-height:1.7;\" style-hover=\"border-color:#A50034;background:#fdf5f7;\"><strong style=\"font-family:'Cairo',sans-serif;font-size:18px;color:#191a1c;display:block;margin-bottom:5px;\">AC inspection<\u002Fstrong>Site inspection visit before buying an AC<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ startRelocate }}\" style=\"text-align:left;padding:22px;border-radius:12px;border:1px solid #d9d5cb;background:#fbfaf7;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-size:14px;color:#6b7075;line-height:1.7;\" style-hover=\"border-color:#A50034;background:#fdf5f7;\"><strong style=\"font-family:'Cairo',sans-serif;font-size:18px;color:#191a1c;display:block;margin-bottom:5px;\">Uninstall &amp; reinstall<\u002Fstrong>Moving the unit or reinstalling it elsewhere<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isInstallMode }}\" hint-placeholder-val=\"{{ false }}\">\n\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;\">\n        <sc-for list=\"{{ crumbs }}\" as=\"c\" hint-placeholder-count=\"2\">\n          <div style=\"padding:6px 13px;border-radius:999px;background:#e6e4de;color:#4c5155;font-size:12.5px;\">{{ c }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ isReceived }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#fff;border:1px solid #e3e0d8;border-radius:14px;padding:32px;animation:cardIn .25s ease;\">\n          <div style=\"font-size:12.5px;font-weight:600;color:#A50034;letter-spacing:.04em;margin-bottom:10px;\">Step 1 — Delivery<\u002Fdiv>\n          <div style=\"font-family:'Cairo',sans-serif;font-weight:700;font-size:26px;line-height:1.5;margin-bottom:8px;\">Has the complete unit been delivered?<\u002Fdiv>\n          <div style=\"font-size:14.5px;color:#6b7075;line-height:1.9;margin-bottom:20px;\">Confirm with the customer that the unit arrived and includes <strong>two boxes<\u002Fstrong> — the indoor unit and the outdoor unit.<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;\">\n            <button sc-camel-on-click=\"{{ toBracket }}\" style=\"text-align:left;padding:20px 22px;border-radius:12px;border:1px solid #c6e0d1;background:#eef6f1;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;\" style-hover=\"border-color:#0f5132;\">\n              <div style=\"font-family:'Cairo',sans-serif;font-weight:700;font-size:18px;color:#0f5132;margin-bottom:4px;\">Yes — delivered<\u002Fdiv>\n              <div style=\"font-size:14px;color:#6b7075;\">Both boxes are there — continue to the next step.<\u002Fdiv>\n            <\u002Fbutton>\n            <button sc-camel-on-click=\"{{ toNotReceived }}\" style=\"text-align:left;padding:20px 22px;border-radius:12px;border:1px solid #f0c2ce;background:#fff5f7;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;\" style-hover=\"border-color:#A50034;\">\n              <div style=\"font-family:'Cairo',sans-serif;font-weight:700;font-size:18px;color:#A50034;margin-bottom:4px;\">No — not delivered yet<\u002Fdiv>\n              <div style=\"font-size:14px;color:#6b7075;\">Advise the customer to postpone the request.<\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isNotReceived }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#fff;border:1px solid #e3e0d8;border-radius:14px;padding:32px;border-top:4px solid #A50034;animation:cardIn .25s ease;\">\n          <div style=\"font-size:12.5px;font-weight:600;color:#A50034;letter-spacing:.04em;margin-bottom:10px;\">Unit not delivered yet<\u002Fdiv>\n          <div style=\"font-family:'Cairo',sans-serif;font-weight:700;font-size:26px;line-height:1.5;margin-bottom:20px;\">Advise the customer to postpone the request<\u002Fdiv>\n          <div style=\"background:#1c1a1b;color:#f6f1f2;border-radius:12px;padding:22px 24px;margin-bottom:20px;\">\n            <div style=\"font-size:12.5px;color:#f0a8bd;margin-bottom:10px;font-weight:600;\">Read to the customer<\u002Fdiv>\n            <div style=\"font-size:17.5px;line-height:2;\">“It is better to log the request <strong>after the product arrives<\u002Fstrong>, so you benefit from the first free visit and the installation is done during it.”<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family:'Cairo',sans-serif;font-weight:900;font-size:18px;margin-bottom:12px;\">What did the customer decide?<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;\">\n            <button sc-camel-on-click=\"{{ toDeferred }}\" style=\"text-align:left;padding:20px 22px;border-radius:12px;border:1px solid #c6e0d1;background:#eef6f1;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;\" style-hover=\"border-color:#0f5132;\">\n              <div style=\"font-family:'Cairo',sans-serif;font-weight:700;font-size:18px;color:#0f5132;margin-bottom:4px;\">Agreed to postpone<\u002Fdiv>\n              <div style=\"font-size:14px;color:#6b7075;\">Will call back once the unit arrives.<\u002Fdiv>\n            <\u002Fbutton>\n            <button sc-camel-on-click=\"{{ toInsist }}\" style=\"text-align:left;padding:20px 22px;border-radius:12px;border:1px solid #f0c2ce;background:#fff5f7;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;\" style-hover=\"border-color:#A50034;\">\n              <div style=\"font-family:'Cairo',sans-serif;font-weight:700;font-size:18px;color:#A50034;margin-bottom:4px;\">Insisted on logging it<\u002Fdiv>\n              <div style=\"font-size:14px;color:#6b7075;\">Says the unit will arrive before the visit.<\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isInsist }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#fff;border:1px solid #e3e0d8;border-radius:14px;padding:32px;border-top:4px solid #A50034;animation:cardIn .25s ease;\">\n          <div style=\"font-size:12.5px;font-weight:600;color:#A50034;letter-spacing:.04em;margin-bottom:10px;\">Customer insisted<\u002Fdiv>\n          <div style=\"font-family:'Cairo',sans-serif;font-weight:700;font-size:26px;line-height:1.5;margin-bottom:20px;\">Confirm this with the customer before continuing<\u002Fdiv>\n          <div style=\"background:#1c1a1b;color:#f6f1f2;border-radius:12px;padding:22px 24px;margin-bottom:20px;\">\n            <div style=\"font-size:12.5px;color:#f0a8bd;margin-bottom:10px;font-weight:600;\">Read to the customer<\u002Fdiv>\n            <div style=\"font-size:17.5px;line-height:2;\">“Please note that <strong>only the first visit for installation<\u002Fstrong> is free — if the technician arrives and the unit has not been delivered, that visit still counts and any further visit will be charged.”<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:18px 22px;border-radius:12px;background:#fff5f7;border:1px solid #f0c2ce;font-size:15.5px;line-height:1.95;\">Log the customer's confirmation inside the order before continuing.<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ toBracket }}\" style=\"margin-top:22px;padding:14px 30px;border-radius:10px;border:none;background:#111314;color:#fff;font-family:'Cairo',sans-serif;font-weight:700;font-size:15px;cursor:pointer;\" style-hover=\"background:#A50034;color:#ffffff;\">Next — outdoor unit bracket<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if> -serif;font-weight:700;font-size:18px;margin-bottom:4px;\">Customer insists on installation<\u002Fdiv>\n              <div style=\"font-size:14px;color:#8a5555;\">Installation only after the customer signs the waiver.<\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"margin-top:22px;\">\n            <button sc-camel-on-click=\"{{ back }}\" style=\"padding:12px 22px;border-radius:10px;border:1px solid #d9d5cb;background:transparent;color:#4c5155;font-family:'IBM Plex Sans',sans-serif;font-size:14px;cursor:pointer;\" style-hover=\"background:#eceae4;\">Back<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isAgreedAlt }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#fff;border:1px solid #e3e0d8;border-radius:14px;padding:32px;animation:cardIn .25s ease;\">\n          <div style=\"font-size:12.5px;font-weight:600;color:#5a5553;letter-spacing:.04em;margin-bottom:10px;\">Ending the call<\u002Fdiv>\n          <div style=\"font-family:'Cairo',sans-serif;font-weight:700;font-size:26px;line-height:1.5;margin-bottom:8px;\">Confirm the customer understood before ending<\u002Fdiv>\n          <div style=\"font-size:14.5px;color:#6b7075;line-height:1.9;margin-bottom:22px;\">No installation order is logged now. The order is logged after the unit is swapped or the suitable room is decided.<\u002Fdiv>\n          <div style=\"background:#1c1a1b;color:#f6f1f2;border-radius:12px;padding:22px 24px;margin-bottom:22px;\">\n            <div style=\"font-size:12.5px;color:#f0a8bd;margin-bottom:10px;font-weight:600;\">Read to the customer<\u002Fdiv>\n            <div style=\"font-size:17px;line-height:2;\">“Understood. So we agree the unit will be installed in a room whose area suits its capacity, or you will swap the unit for a ..... HP one. Once that is settled, call us and we will log the installation order right away. Is there anything else I can help you with?”<\u002Fd future and no leak occurs.”<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:12px;flex-wrap:wrap;\">\n            <button sc-camel-on-click=\"{{ toChannel }}\" style=\"padding:14px 30px;border-radius:10px;border:none;background:#111314;color:#fff;font-family:'Cairo',sans-serif;font-weight:700;font-size:15px;cursor:pointer;\" style-hover=\"background:#A50034;color:#ffffff;\">Next — purchase channel<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ back }}\" style=\"padding:14px 24px;border-radius:10px;border:1px solid #d9d5cb;background:transparent;color:#4c5155;font-family:'IBM Plex Sans',sans-serif;font-size:14px;cursor:pointer;\" style-hover=\"background:#eceae4;\">Back<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isChannel }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#fff;border:1px solid #e3e0d8;border-radius:14px;padding:32px;animation:cardIn .25s ease;\">\n          <div style=\"font-size:12.5px;font-weight:600;color:#A50034;letter-spacing:.04em;margin-bottom:10px;\">Step 5 — Purchase channel<\u002Fdiv>\n          <div style=\"font-family:'Cairo',sans-serif;font-weight:700;font-size:26px;line-height:1.5;margin-bottom:8px;\">Ask the customer: bought from a dealer or from the LG website?<\u002Fdiv>\n          <div style=\"font-size:14.5px;color:#6b7075;margin-bottom:24px;\">Do not continue before identifying the purchase source — each path has different conditions and fees.<\u002Fdiv>\n          <div style=\"display:grid;gap:12px;\">\n            <button sc-camel-on-click=\"{{ toDealerList }}\" style=\"text-align:left;padding:20px 22px;border-radius:12px;border:1px solid #d9d5cb;background:#fbfaf7;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;\" style-hover=\"border-color:#A50034;background:#fdf5f7;\">\n              <div style=\"font-family:'Cairo',sans-serif;font-weight:700;font-size:18px;margin-bottom:4px;\">Bought from a deale r-radius:12px;background:#fbfaf7;border:1px solid #e3e0d8;\">\n              <div style=\"font-family:'Cairo',sans-serif;font-weight:900;font-size:18px;color:#A50034;\">3<\u002Fdiv>\n              <div style=\"font-size:15.5px;line-height:1.85;\">Full address: governorate, area, street name, building number, floor, apartment, landmark.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:24px;padding-top:22px;border-top:1px solid #eeebe4;\">\n            <div style=\"font-size:12.5px;font-weight:600;color:#A50034;margin-bottom:8px;\">Logging the order on the system<\u002Fdiv>\n            <div style=\"font-family:'Cairo',sans-serif;font-weight:900;font-size:19px;margin-bottom:14px;\">Choosing the correct Symptom<\u002Fdiv>\n            <sc-if value=\"{{ isOnlineSource }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:20px;border-radius:12px;background:#fff5f7;border:1px solid #f0c2ce;\">\n                <div style=\"font-family:'Cairo',sans-serif;font-weight:900;font-size:17px;color:#A50034;margin-bottom:10px;\">Customer bought from OBS (LG website)<\u002Fdiv>\n                <div style=\"display:grid;gap:9px;font-size:15px;line-height:1.85;\">\n                  <div>1 — Ask the customer for the <strong>purchase order number<\u002Fstrong>.<\u002Fdiv>\n                  <div>2 — Enter it in the <strong>OBS Order No<\u002Fstrong> field on the system.<\u002Fdiv>\n                  <div>3 — Select <strong>Symptom: OBS<\u002Fstrong>.<\u002Fdiv>\n                  <div>4 — And <strong>Sub Symptom: Product Installation<\u002Fstrong>.<\u002Fdiv>\n                <div style=\"margin-top:12px;padding:12px 14px;border-radius:10px;background:#fff;border:1px solid #A50034;color:#A50034;font-size:14.5px;line-height:1.8;font-weight:600;\">If the customer does not have the purchase order number: log the order normally and select <strong>Symptom: Installation/Connection<\u002Fstrong> — same as a regular dealer.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-top:14px;padding:14px;border-radius:12px;background:#fbfaf7;border:1px solid #e9e6de;\">\n                <div style=\"font-size:13px;color:#6b7075;margin-bottom:10px;\">System screen — where the fields are<\u002Fdiv>\n                <img src=\"5ec6ba6f-7add-44f4-9143-fd579937ebb4\" alt=\"OBS Order No and Symptom on the system\" style=\"width:100%;max-width:460px;border-radius:8px;display:block;\">\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ isDealerSource }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"padding:20px;border-radius:12px;background:#fbfaf7;border:1px solid #e9e6de;\">\n                <div style=\"font-size:15.5px;line-height:1.9;\">Select <strong>Symptom: Installation/Connection<\u002Fstrong>.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;gap:12px;margin-top:26px;\">\n            <button sc-camel-on-click=\"{{ toSched }}\" style=\"padding:14px 30px;border-radius:10px;border:none;background:#111314;color:#fff;font-family:'Cairo',sans-serif;font-weight:700;font-size:15px;cursor:pointer;\" style-hover=\"background:#A50034;color:#ffffff;\">Next — scheduling<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ back }}\" style=\"padding:14px 24px;border-radius:10px;border:1px solid #d9d5cb;background:transparent;color:#4c5155;font-family:'IBM Plex Sans',sans-serif;font-size:14px;cursor:pointer;\" style-hover=\"background:#eceae4;\">Back<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isSched }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#fff;border:1px solid #e3e0d8;border-radius:14px;padding:32px;animation:cardIn .25s ease;\">\n          <div style=\"font-size:12.5px;font-weight:600;color:#A50034;letter-spacing:.04em;margin-bottom:10px;\">{{ schedKicker }}<\u002Fdiv>\n          <div style=\"font-family:'Cairo',sans-serif;font-weight:700;font-size:26px;line-height:1.5;margin-bottom:20px;\">Check available capacity and set the appointment<\u002Fdiv>\n          <div style=\"display:grid;gap:12px;\">\n            <div style=\"display:flex;gap:16px;padding:16px 20px;border-radius:12px;background:#fbfaf7;border:1px solid #e9e6de;\"><div style=\"font-family:'Cairo',sans-serif;font-weight:900;font-size:17px;color:#A50034;min-width:20px;\">1<\u002Fdiv><div style=\"font-size:15.5px;line-height:1.9;\">Check the <strong>available capacity<\u002Fstrong> on the system before promising any slot.<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;gap:16px;padding:16px 20px;border-radius:12px;background:#fbfaf7;border:1px solid #e9e6de;\"><div style=\"font-family:'Cairo',sans-serif;font-weight:900;font-size:17px;color:#A50034;min-width:20px;\">2<\u002Fdiv><div style=\"font-size:15.5px;line-height:1.9;\">Tell the customer the <strong>available visit slots<\u002Fstrong>.<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;gap:16px;padding:16px 20px;border-radius:12px;background:#fbfaf7;border:1px solid #e9e6de;\"><div style=\"font-family:'Cairo',sans-serif;font-weight:900;font-size:17px;color:#A50034;min-width:20px;\">3<\u002Fdiv><div style=\"font-size:15.5px;line-height:1.9;\">Ask him for his <strong>preferred slot<\u002Fstrong> and record it on the order. <span style=\"color:#A50034;\">(If he does not answer the question, pick the earliest available slot and inform him of it.)<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:22px;\">\n            <button sc-camel-on-click=\"{{ toDone }}\" style=\"padding:14px 30px;border-radius:10px;border:none;background:#111314;color:#fff;font-family:'Cairo',sans-serif;font-weight:700;font-size:15px;cursor:pointer;\" style-hover=\"background:#A50034;color:#ffffff;\">Done — end the call<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ openOrderRules }}\" style=\"padding:14px 28px;border-radius:10px;border:1px solid #A50034;background:#fff;color:#A50034;font-family:'Cairo',sans-serif;font-weight:700;font-size:15px;cursor:pointer;\" style-hover=\"background:#A50034;color:#fff;\">Order logging rules<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ back }}\" style=\"padding:14px 24px;border-radius:10px;border:1px solid #d9d5cb;background:transparent;color:#4c5155;font-family:'IBM Plex Sans',sans-serif;font-size:14px;cursor:pointer;\" style-hover=\"background:#eceae4;\">Back<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isDone }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#1c1a1b;color:#f6f1f2;border-radius:14px;padding:38px 32px;animation:cardIn .25s ease;\">\n          <div style=\"font-family:'Cairo',sans-serif;font-weight:900;font-size:28px;margin-bottom:12px;\">Flow complete<\u002Fdiv>\n          <div style=\"font-size:15.5px;line-height:1.9;color:#d9cbcf;max-width:60ch;margin-bottom:26px;text-wrap:pretty;\">Before closing, confirm the customer understood the next step and that the invoice is ready if an installation order was logged.<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ restart }}\" style=\"padding:14px 30px;border-radius:10px;border:none;background:#A50034;color:#ffffff;font-family:'Cairo',sans-serif;font-weight:700;font-size:15px;cursor:pointer;\" style-hover=\"background:#C4004A;\">New call<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showMap }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#fff;border:1px solid #e3e0d8;border-radius:14px;padding:30px 32px;\">\n          <div style=\"font-family:'Cairo',sans-serif;font-weight:700;font-size:20px;margin-bottom:18px;\">Full flow map<\u002Fdiv>\n          <div style=\"display:grid;gap:14px;font-size:14.5px;line-height:1.8;\">\n            <div style=\"padding:14px 18px;border-radius:10px;background:#111314;color:#f4f3ef;font-family:'Cairo',sans-serif;font-weight:700;\">1 Delivery (two boxes) → 2 Bracket → 3 Capacity &amp; conditions → 4 Piping type → 5 Purchase channel: dealer or LG website?<\u002Fdiv>\n            <div style=\"display:grid;gap:10px;\">\n              <div style=\"padding:12px 16px;border-radius:10px;background:#fbfaf7;border:1px solid #e3e0d8;\"><strong>Delivery<\u002Fstrong> — not delivered → advise postponing; if he insists, confirm that only the first installation visit is free.<\u002Fdiv>\n              <div style=\"padding:12px 16px;border-radius:10px;background:#fbfaf7;border:1px solid #e3e0d8;\"><strong>Bracket<\u002Fstrong> — not available → supply it with the technician for a fee (EGP 850 / 880) and add the part number in the order, or the customer buys it from a dealer.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;\">\n              <div style=\"display:grid;gap:10px;align-content:start;\">\n                <div style=\"padding:12px 16px;border-radius:10px;background:#fbf0f3;border:1px solid #ecd2da;font-weight:600;\">Dealer<\u002Fdiv>\n                <div style=\"padding:12px 16px;border-radius:10px;background:#fbfaf7;border:1px solid #e3e0d8;\">On the list → free installation through us, order logged — tax invoice must be ready for the technician<\u002Fdiv>\n                <div style=\"padding:12px 16px;border-radius:10px;background:#fbfaf7;border:1px solid #e3e0d8;\">Not on the list → the dealer installs it free of charge<\u002Fdiv>\n                <div style=\"padding:12px 16px;border-radius:10px;background:#fdf5f5;border:1px solid #e6c9c9;\">Dealer refused → log a VOC complaint<\u002Fdiv>\n                <div style=\"padding:12px 16px;border-radius:10px;background:#fdf6e8;border:1px solid #ecd9ae;\">Wants us to install → paid: EGP 963 / 1349<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:grid;gap:10px;align-content:start;\">\n                <div style=\"padding:12px 16px;border-radius:10px;background:#fbf0f3;border:1px solid #ecd2da;font-weight:600;\">LG website<\u002Fdiv>\n                <div style=\"padding:12px 16px;border-radius:10px;background:#fbfaf7;border:1px solid #e3e0d8;\">Installation is free<\u002Fdiv>\n                <div style=\"padding:12px 16px;border-radius:10px;background:#fdf6e8;border:1px solid #ecd9ae;\">Bracket not included — the customer buys it from the website or we supply it with the technician for a fee<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:12px 16px;border-radius:10px;background:#fbfaf7;border:1px solid #e3e0d8;\"><strong>Piping type<\u002Fstrong> — concealed wall piping → pressure-test visit first at EGP 450, then a no-leak check visit after 48 hours, then installation; a pressure-test done outside LG is not accepted.<\u002Fdiv>\n            <div style=\"padding:14px 18px;border-radius:10px;background:#f3f2f1;border:1px solid #dfdcda;\">All paths end with: installation fees (free the first time, EGP 963 / 1349 the second) → order details (full name, phone numbers, detailed address) → scheduling.<\u002Fdiv>\n            <div style=\"padding:14px 18px;border-radius:10px;background:#fdf5f5;border:1px solid #e6c9c9;\">If the capacity does not suit the room area or conditions are not met (step 3) and the customer insists on installation → <a href=\"ref-declaration.html\" target=\"_blank\">the customer signs the waiver<\u002Fa> (warranty voided, customer bears maintenance costs) before installation.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isRelocateMode }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#fff;border:1px solid #e3e0d8;border-radius:14px;padding:32px;animation:cardIn .25s ease;\">\n          <div style=\"font-size:12.5px;font-weight:600;color:#A50034;letter-spacing:.04em;margin-bottom:10px;\">RAC Labor Cost — uninstall &amp; reinstall<\u002Fdiv>\n          <div style=\"font-family:'Cairo',sans-serif;font-weight:900;font-size:26px;line-height:1.5;margin-bottom:8px;\">Same apartment, or moving to another apartment (even in the same building)?<\u002Fdiv>\n          <div style=\"font-size:14.5px;color:#6b7075;line-height:1.9;margin-bottom:20px;\">Ask the customer to determine the correct fees.<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;\">\n            <button sc-camel-on-click=\"{{ pickSameHome }}\" style=\"{{ sameHomeStyle }}\">Same apartment<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ pickNewHome }}\" style=\"{{ newHomeStyle }}\">Another apartment (even in the same building)<\u002Fbutton>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ isSameHome }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:22px;display:grid;gap:12px;\">\n              <div style=\"overflow-x:auto;\">\n                <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:15px;\">\n                  <sc-raw-thead>\n                    <sc-raw-tr style=\"background:#111314;color:#f4f3ef;font-family:'Cairo',sans-serif;\">\n                      <sc-raw-th style=\"padding:12px 14px;text-align:left;font-weight:700;\">Procedure<\u002Fsc-raw-th>\n                      <sc-raw-th style=\"padding:12px 14px;text-align:left;font-weight:700;\">Cost<\u002Fsc-raw-th>\n                    <\u002Fsc-raw-tr>\n                  <\u002Fsc-raw-thead>\n                  <sc-raw-tbody>\n                    <sc-raw-tr style=\"background:#fbfaf7;\"><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #e9e6de;\">Uninstall &amp; reinstall one unit in the same place<\u002Fsc-raw-td><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #e9e6de;font-family:'Cairo',sans-serif;font-weight:900;font-size:16px;\">EGP 963 up to 3 HP / EGP 1349 for 4 and 5 HP<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                    <sc-raw-tr style=\"background:#fff;\"><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #e9e6de;\">Uninstall both indoor and outdoor units<\u002Fsc-raw-td><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #e9e6de;font-family:'Cairo',sans-serif;font-weight:900;font-size:16px;\">EGP 963 up to 3 HP / EGP 1349 for 4 and 5 HP<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                    <sc-raw-tr style=\"background:#fbfaf7;\"><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #e9e6de;\">Install both indoor and outdoor units<\u002Fsc-raw-td><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #e9e6de;font-family:'Cairo',sans-serif;font-weight:900;font-size:16px;\">EGP 963 up to 3 HP / EGP 1349 for 4 and 5 HP<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                    <sc-raw-tr style=\"background:#fff;\"><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #e9e6de;\">Uninstall &amp; reinstall both units in the same visit<\u002Fsc-raw-td><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #e9e6de;font-family:'Cairo',sans-serif;font-weight:900;font-size:16px;\">EGP 1927 up to 3 HP / EGP 2788 for 4 and 5 HP<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                  <\u002Fsc-raw-tbody>\n                <\u002Fsc-raw-table>\n              <\u002Fdiv>\n              <div style=\"padding:16px 20px;border-radius:12px;background:#fff5f7;border:1px solid #f0c2ce;font-size:15.5px;line-height:1.9;\"><strong style=\"color:#A50034;\">Agent note:<\u002Fstrong> when uninstalling and reinstalling in the <strong>same apartment<\u002Fstrong>, log <strong>one order only<\u002Fstrong>.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isNewHome }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:22px;display:grid;gap:12px;\">\n              <div style=\"overflow-x:auto;\">\n                <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:15px;\">\n                  <sc-raw-thead>\n                    <sc-raw-tr style=\"background:#111314;color:#f4f3ef;font-family:'Cairo',sans-serif;\">\n                      <sc-raw-th style=\"padding:12px 14px;text-align:left;font-weight:700;\">Procedure<\u002Fsc-raw-th>\n                      <sc-raw-th style=\"padding:12px 14px;text-align:left;font-weight:700;\">Cost<\u002Fsc-raw-th>\n                    <\u002Fsc-raw-tr>\n                  <\u002Fsc-raw-thead>\n                  <sc-raw-tbody>\n                    <sc-raw-tr style=\"background:#fff;\"><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #e9e6de;\">Uninstall both indoor and outdoor units<\u002Fsc-raw-td><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #e9e6de;font-family:'Cairo',sans-serif;font-weight:900;font-size:16px;\">EGP 963 up to 3 HP / EGP 1349 for 4 and 5 HP<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                    <sc-raw-tr style=\"background:#fbfaf7;\"><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #e9e6de;\">Install both indoor and outdoor units<\u002Fsc-raw-td><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #e9e6de;font-family:'Cairo',sans-serif;font-weight:900;font-size:16px;\">EGP 963 up to 3 HP / EGP 1349 for 4 and 5 HP<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                  <\u002Fsc-raw-tbody>\n                <\u002Fsc-raw-table>\n              <\u002Fdiv>\n              <div style=\"padding:16px 20px;border-radius:12px;background:#fff5f7;border:1px solid #f0c2ce;font-size:15.5px;line-height:1.9;\"><strong style=\"color:#A50034;\">Agent note:<\u002Fstrong> when moving to another apartment, log <strong>two orders<\u002Fstrong> — one <strong>before the move<\u002Fstrong> (uninstall) and one <strong>after the move<\u002Fstrong> (install).<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ relocatePicked }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:12px;display:grid;gap:12px;\">\n              <div style=\"display:flex;gap:16px;padding:17px 20px;border-radius:12px;background:#fbfaf7;border:1px solid #e9e6de;\"><div style=\"font-size:15.5px;line-height:1.9;\">If the technician or the customer requests <strong>pipe extension<\u002Fstrong> during the work — tell the customer that the <strong>cost of the extra piping will be communicated by the technician<\u002Fstrong>.<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;gap:16px;padding:17px 20px;border-radius:12px;background:#fff5f7;border:1px solid #f0c2ce;\"><div style=\"font-size:15.5px;line-height:1.9;\">A <strong>visit fee of EGP 300<\u002Fstrong> applies if the installation does not happen for any reason <strong>not technical<\u002Fstrong> to the AC — for example the room area not matching the unit capacity, or any other blocker.<\u002Fdiv><\u002Fdiv>\n              <button sc-camel-on-click=\"{{ toFitCheck }}\" style=\"justify-self:start;margin-top:6px;padding:14px 30px;border-radius:10px;border:none;background:#111314;color:#fff;font-family:'Cairo',sans-serif;font-weight:700;font-size:15px;cursor:pointer;\" style-hover=\"background:#A50034;color:#ffffff;\">Next — capacity and conditions check<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isInspectionMode }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#fff;border:1px solid #e3e0d8;border-radius:14px;padding:32px;animation:cardIn .25s ease;\">\n          <div style=\"font-size:12.5px;font-weight:600;color:#A50034;letter-spacing:.04em;margin-bottom:10px;\">RAC — AC inspection<\u002Fdiv>\n          <div style=\"font-family:'Cairo',sans-serif;font-weight:900;font-size:26px;margin-bottom:8px;\">Rules for AC inspection visits<\u002Fdiv>\n          <div style=\"font-size:15px;color:#6b7075;line-height:1.9;margin-bottom:22px;\">When a customer requests an inspection <strong>before buying an AC<\u002Fstrong>, charge as follows.<\u002Fdiv>\n          <div style=\"display:grid;gap:12px;margin-bottom:24px;\">\n            <div style=\"display:flex;gap:16px;padding:17px 20px;border-radius:12px;background:#fbfaf7;border:1px solid #e9e6de;\"><div style=\"font-family:'Cairo',sans-serif;font-weight:900;font-size:17px;color:#A50034;min-width:20px;\">1<\u002Fdiv><div style=\"font-size:15.5px;line-height:1.9;\">From <strong>one to three units<\u002Fstrong>, charge <strong>one visit only = EGP 300<\u002Fstrong>.<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;gap:16px;padding:17px 20px;border-radius:12px;background:#fbfaf7;border:1px solid #e9e6de;\"><div style=\"font-family:'Cairo',sans-serif;font-weight:900;font-size:17px;color:#A50034;min-width:20px;\">2<\u002Fdiv><div style=\"font-size:15.5px;line-height:1.9;\">For <strong>more units<\u002Fstrong>, charge <strong>one visit per three units<\u002Fstrong> = one order at <strong>EGP 300<\u002Fstrong>.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family:'Cairo',sans-serif;font-weight:900;font-size:18px;margin-bottom:12px;\">Examples<\u002Fdiv>\n          <div style=\"display:grid;gap:10px;margin-bottom:24px;\">\n            <div style=\"padding:16px 20px;border-radius:12px;background:#1c1a1b;color:#f6f1f2;font-size:15.5px;line-height:1.85;\">Inspecting <strong>5 units<\u002Fstrong> is charged as <strong>two visits<\u002Fstrong> = 300 + 300 EGP.<\u002Fdiv>\n            <div style=\"padding:16px 20px;border-radius:12px;background:#1c1a1b;color:#f6f1f2;font-size:15.5px;line-height:1.85;\">Inspecting <strong>10 units<\u002Fstrong> is charged as <strong>3 visits<\u002Fstrong> = 300 + 300 + 300 EGP.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family:'Cairo',sans-serif;font-weight:900;font-size:18px;margin-bottom:12px;\">Logging the inspection order<\u002Fdiv>\n          <div style=\"padding:18px 22px;border-radius:12px;background:#fff5f7;border:1px solid #f0c2ce;font-size:15.5px;line-height:1.95;margin-bottom:14px;\">For an inspection order, log <strong>one order only<\u002Fstrong> regardless of the number of units, and <strong>state the number inside the order<\u002Fstrong>.<\u002Fdiv>\n          <div style=\"padding:16px 20px;border-radius:12px;background:#1c1a1b;color:#f6f1f2;font-size:15.5px;line-height:1.9;\">Example: for <strong>more than 10 units<\u002Fstrong> recalculate the same way — if the customer has <strong>17 ACs<\u002Fstrong>, every <strong>3 units<\u002Fstrong> is one order, i.e. 300 × 6 EGP.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:14px;position:sticky;top:96px;\">\n      <div style=\"background:#fdf6e8;border:1px solid #ecd9ae;border-radius:14px;padding:20px;\">\n        <div style=\"font-family:'Cairo',sans-serif;font-weight:700;font-size:15px;color:#7a5410;margin-bottom:10px;\">Important — must be told to the customer<\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.85;color:#4a3c1c;\">When buying from any dealer on the free-installation list: the tax invoice must be ready for the technician to review before installation.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e3e0d8;border-radius:14px;padding:20px;\">\n        <div style=\"font-family:'Cairo',sans-serif;font-weight:700;font-size:15px;margin-bottom:12px;\">Quick links<\u002Fdiv>\n        <div style=\"display:grid;gap:10px;font-size:14px;line-height:1.7;\">\n          <a href=\"ref-dealers.html\">Free-installation dealer list<\u002Fa>\n          <a href=\"ref-capacity.html\">Top-floor thermal insulation<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e3e0d8;border-radius:14px;padding:20px;\">\n        <div style=\"font-family:'Cairo', ng:32px 20px;overflow:auto;font-family:'IBM Plex Sans',system-ui,sans-serif;\">\n    <div style=\"width:100%;max-width:860px;background:#f4f3ef;border-radius:16px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.35);\">\n      <div style=\"position:sticky;top:0;padding:16px 26px;background:#111314;color:#f4f3ef;display:flex;align-items:center;justify-content:space-between;gap:14px;\">\n        <div style=\"font-family:'Cairo',sans-serif;font-weight:700;font-size:18px;\">Order logging rules — Service Network<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ closeOrderRules }}\" style=\"padding:9px 18px;border-radius:8px;border:1px solid #3a4043;background:transparent;color:#e4e7e9;font-family:'IBM Plex Sans',sans-serif;font-size:13px;cursor:pointer;\" style-hover=\"background:#22282a;\">Close<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"padding:26px;color:#191a1c;\">\n        <div style=\"background:#fff;border:1px solid #e3e0d8;border-radius:14px;padding:24px;display:grid;gap:11px;\">\n          <div style=\"display:flex;gap:14px;padding:16px 18px;border-radius:12px;background:#fbfaf7;border:1px solid #e9e6de;\"><div style=\"font-family:'Cairo',sans-serif;font-weight:900;font-size:16px;color:#A50034;min-width:18px;\">1<\u002Fdiv><div style=\"font-size:15px;line-height:1.9;\">The centre has <strong>priority<\u002Fstrong> for AC installation orders and appears only in <strong>Cairo<\u002Fstrong> and <strong>Alexandria<\u002Fstrong>.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:14px;padding:16px 18px;border-radius:12px;background:#fbfaf7;border:1px solid #e9e6de;\"><div style=\"font-family:'Cairo',sans-serif;font-weight:900;font-size:16px;color:#A50034;min-width:18px;\">2<\u002Fdiv><div style=\"font-size:15px;line-height:1.9;\">Log the order <strong>dated the next day<\u002Fstrong>, and for more than one unit book the <strong>morning slots<\u002Fstrong>.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:14px;padding:16px 18px;border-radius:12px;background:#fff5f7;border:1px solid #f0c2ce;\"><div style=\"font-family:'Cairo',sans-serif;font-weight:900;font-size:16px;color:#A50034;min-width:18px;\">3<\u002Fdiv><div style=\"font-size:15px;line-height:1.9;\"><strong>Never promise the visit will be at the end of the slot<\u002Fstrong> — leave it to the technician to coordinate.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:14px;padding:16px 18px;border-radius:12px;background:#fbfaf7;border:1px solid #e9e6de;\"><div style=\"font-family:'Cairo',sans-serif;font-weight:900;font-size:16px;color:#A50034;min-width:18px;\">4<\u002Fdiv><div style=\"font-size:15px;line-height:1.9;\">If the customer has more than one unit, log <strong>as many orders as units<\u002Fstrong>.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:14px;padding:16px 18px;border-radius:12px;background:#fff5f7;border:1px solid #f0c2ce;\"><div style=\"font-family:'Cairo',sans-serif;font-weight:900;font-size:16px;color:#A50034;min-width:18px;\">5<\u002Fdiv><div style=\"font-size:15px;line-height:1.9;\"><strong>No orders in Madinaty or a compound after the third slot<\u002Fstrong>; on official holidays coordinate per the compound's hours.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:14px;padding:16px 18px;border-radius:12px;background:#fff5f7;border:1px solid #f0c2ce;\"><div style=\"font-family:'Cairo',sans-serif;font-weight:900;font-size:16px;color:#A50034;min-width:18px;\">6<\u002Fdiv><div style=\"font-size:15px;line-height:1.9;\">The centre <strong>does not operate on official holidays<\u002Fstrong> — no orders are logged on it.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showNoCap }}\" hint-placeholder-val=\"{{ false }}\">\n  <div dir=\"ltr\" style=\"position:fixed;inset:0;z-index:80;background:rgba(17,19,20,.6);display:flex;align-items:flex-start;justify-content:center;padding:32px 20px;overflow:auto;font-family:'IBM Plex Sans',system-ui,sans-serif;\">\n    <div style=\"width:100%;max-width:880px;background:#f4f3ef;border-radius:16px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.35);\">\n      <div style=\"position:sticky;top:0;padding:16px 26px;background:#111314;color:#f4f3ef;display:flex;align-items:center;justify-content:space-between;gap:14px;\">\n        <div>\n          <div style=\"font-family:'Cairo',sans-serif;font-weight:700;font-size:18px;\">No Capacity Process<\u002Fdiv>\n          <div style=\"font-size:12px;color:#9ea4a8;\">Installation orders only<\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ closeNoCap }}\" style=\"padding:9px 18px;border-radius:8px;border:1px solid #3a4043;background:transparent;color:#e4e7e9;font-family:'IBM Plex Sans',sans-serif;font-size:13px;cursor:pointer;\" style-hover=\"background:#22282a;\">Close<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"padding:26px;display:flex;flex-direction:column;gap:18px;color:#191a1c;\">\n        <div style=\"background:#fff5f7;border:1px solid #f0c2ce;border-radius:14px;padding:22px 24px;\">\n          <div style=\"font-family:'Cairo',sans-serif;font-weight:900;font-size:17px;color:#A50034;margin-bottom:12px;\">When to follow this process<\u002Fdiv>\n          <div style=\"font-size:15.5px;line-height:1.95;margin-bottom:12px;\">If a customer calls to log an installation order and we had to apologise for one of the following reasons:<\u002Fdiv>\n          <div style=\"display:grid;gap:10px;\">\n            <div style=\"padding:13px 17px;border-radius:10px;background:#fff;border:1px solid #f0c2ce;font-size:15px;line-height:1.85;\">No available slots on the system.<\u002Fdiv>\n            <div style=\"padding:13px 17px;border-radius:10px;background:#fff;border:1px solid #f0c2ce;font-size:15px;line-height:1.85;\">Or no available centres.<\u002Fdiv>\n            <div style=\"padding:13px 17px;border-radius:10px;background:#fff;border:1px solid #f0c2ce;font-size:15px;line-height:1.85;\">Or there is a <strong>Reclaim<\u002Fstrong> request and the centre is not showing on the system.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #e3e0d8;border-radius:14px;padding:24px;\">\n          <div style=\"font-family:'Cairo',sans-serif;font-weight:900;font-size:19px;margin-bottom:16px;\">Follow these steps<\u002Fdiv>\n          <div style=\"display:grid;gap:12px;\">\n            <div style=\"display:flex;gap:14px;padding:16px 18px;border-radius:12px;background:#fbfaf7;border:1px solid #e9e6de;\"><div style=\"width:26px;height:26px;flex:none;border-radius:8px;background:#A50034;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Cairo',sans-serif;font-weight:900;font-size:13px;\">1<\u002Fdiv><div style=\"font-size:15px;line-height:1.95;\">Log the <strong>customer's full details<\u002Fstrong> and write inside the inquiry why the installation order could not be logged.<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;gap:14px;padding:16px 18px;border-radius:12px;background:#fbfaf7;border:1px solid #e9e6de;\"><div style=\"width:26px;height:26px;flex:none;border-radius:8px;background:#A50034;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Cairo',sans-serif;font-weight:900;font-size:13px;\">2<\u002Fdiv><div style=\"font-size:15px;line-height:1.95;\">Select the <strong>Symptom<\u002Fstrong> that was meant to be logged on the order.<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;gap:14px;padding:16px 18px;border-radius:12px;background:#fbfaf7;border:1px solid #e9e6de;\"><div style=\"width:26px;height:26px;flex:none;border-radius:8px;background:#A50034;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Cairo',sans-serif;font-weight:900;font-size:13px;\">3<\u002Fdiv><div style=\"font-size:15px;line-height:1.95;\"><strong>Assign<\u002Fstrong> the <strong>Call Back Agent<\u002Fstrong> field to <strong>Capacity Availability<\u002Fstrong>. The Service Network team reviews the inquiries, tries to open slots and show the centre, then transfers the inquiry from No Capacity Process to Alshaima.<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;gap:14px;padding:16px 18px;border-radius:12px;background:#fff5f7;border:1px solid #f0c2ce;\"><div style=\"width:26px;height:26px;flex:none;border-radius:8px;background:#A50034;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Cairo',sans-serif;font-weight:900;font-size:13px;\">4<\u002Fdiv><div style=\"font-size:15px;line-height:1.95;\">The Schedule Complain department will call the customer <strong>within the day<\u002Fstrong>. For an installation order select <strong>Delivery/Installation : Installation schedule Check and Change visit time<\u002Fstrong>.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#1c1a1b;color:#f6f1f2;border-radius:14px;padding:24px;\">\n          <div style=\"font-size:12.5px;color:#f0a8bd;margin-bottom:14px;font-weight:600;\">Script — read to the customer<\u002Fdiv>\n          <div style=\"display:grid;gap:11px;\">\n            <div style=\"padding:15px 18px;border-radius:12px;background:#282526;font-size:15.5px;line-height:2;\"><strong style=\"color:#f0a8bd;\">Agent:<\u002Fstrong> “I apologise, unfortunately there are no slots available to log the request. I have raised a request to the responsible department to arrange a slot for you, and I kindly ask you to wait for them to confirm the visit date with you.”<\u002Fdiv>\n            <div style=\"padding:15px 18px;border-radius:12px;background:#22201f;font-size:15.5px;line-height:2;\"><strong style=\"color:#9ea4a8;\">Customer:<\u002Fstrong> “When will they call me?”<\u002Fdiv>\n            <div style=\"padding:15px 18px;border-radius:12px;background:#282526;font-size:15.5px;line-height:2;\"><strong style=\"color:#f0a8bd;\">Agent:<\u002Fstrong> “Within the day, sir.”<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #e3e0d8;border-radius:14px;padding:24px;display:grid;gap:11px;\">\n          <div style=\"padding:15px 18px;border-radius:12px;background:#fbfaf7;border:1px solid #e9e6de;font-size:15px;line-height:1.95;\">If the customer calls back after the request to add a <strong>model<\u002Fstrong> or an extra number — add it on the system and update the open inquiry.<\u002Fdiv>\n          <div style=\"padding:15px 18px;border-radius:12px;background:#fbfaf7;border:1px solid #e9e6de;font-size:15px;line-height:1.95;\">If the customer calls to cancel the order — close the inquiry and update it before closing.<\u002Fdiv>\n          <div style=\"padding:15px 18px;border-radius:12px;background:#fff5f7;border:1px solid #f0c2ce;font-size:15px;line-height:1.95;\">If the customer contacts us after <strong>5:30 PM<\u002Fstrong> or on Friday — tell him we will follow up the next day to confirm the visit date.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<div dir=\"ltr\" style=\"background:#f4f3ef;padding:8px 28px 48px;display:flex;justify-content:center;font-family:'IBM Plex Sans',system-ui,sans-serif;\">\n  <a href=\"index.html\" style=\"display:inline-flex;align-items:center;gap:10px;padding:14px 30px;border-radius:12px;background:#111314;color:#f4f3ef;font-family:'Cairo',sans-serif;font-weight:700;font-size:15px;text-decoration:none;\" style-hover=\"background:#A50034;color:#fff;\">← Back to all products<\u002Fa>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst LABELS = {\n  start: 'Start',\n  received: 'Delivery',\n  notReceived: 'Not delivered',\n  insist: 'Customer insisted',\n  deferred: 'Postponed',\n  bracket: 'Bracket',\n  noBracket: 'Supplying the bracket',\n  fitCheck: 'Capacity check',\n  notFit: 'Mismatch',\n  agreedAlt: 'Alternative accepted',\n  waiver: 'Waiver',\n  pipes: 'Piping type',\n  buried: 'Concealed piping',\n  channel: 'Purchase channel',\n  online: 'LG website',\n  dealerList: 'Dealer list',\n  dealerIn: 'Dealer on list',\n  dealerOut: 'Dealer not on list',\n  voc: 'VOC complaint',\n  paid: 'Paid installation',\n  script: 'Installation fees',\n  capture: 'Order details',\n  sched: 'Scheduling',\n  done: 'Call ended',\n  inspection: 'AC inspection',\n  relocate: 'Uninstall & reinstall'\n};\n\nclass Component extends DCLogic {\n  state = { node: 'start', mode: 'free', history: [], serviceMode: '', buySource: '' };\n\n  go(id, mode) {\n    this.setState(s => ({\n      node: id,\n      mode: mode === undefined ? s.mode : mode,\n      history: s.history.concat([s.node])\n    }));\n    window.scrollTo(0, 0);\n  }\n\n  pickBtn(active) {\n    return 'text-align:left;padding:18px 20px;border-radius:12px;cursor:pointer;font-family:\\'Cairo\\',sans-serif;font-weight:700;font-size:17px;border:1px solid ' +\n      (active ? '#A50034;background:#A50034;color:#fff;' : '#d9d5cb;background:#fbfaf7;color:#191a1c;');\n  }\n\n  renderVals() {\n    const n = this.state.node;\n    const svc = this.state.serviceMode;\n    const atStart = n === 'start';\n    const relocate = svc === 'relocate';\n    return {\n      stepNo: this.state.history.length + 1,\n      crumbs: this.state.history.concat([n]).map(id => LABELS[id] || id),\n\n      isStart: atStart,\n      isInstallMode: (svc === 'install' || relocate) && !atStart,\n      isInstallOnly: svc === 'install' && !atStart,\n      isInspectionMode: svc === 'inspection' && !atStart,\n      isRelocateMode: relocate && n === 'relocate',\n\n      startInstall: () => { this.setState({ serviceMode: 'install' }); this.go('received'); },\n      startInspection: () => { this.setState({ serviceMode: 'inspection' }); this.go('inspection'); },\n      startRelocate: () => { this.setState({ serviceMode: 'relocate' }); this.go('relocate'); },\n\n      isReceived: n === 'received',\n      isNotReceived: n === 'notReceived',\n      isInsist: n === 'insist',\n      isDeferred: n === 'deferred',\n      isBracket: n === 'bracket',\n      isNoBracket: n === 'noBracket',\n      isFitCheck: n === 'fitCheck',\n      isNotFit: n === 'notFit',\n      isAgreedAlt: n === 'agreedAlt',\n      isWaiver: n === 'waiver',\n      isPipes: n === 'pipes',\n      isBuried: n === 'buried',\n      isChannel: n === 'channel',\n      isOnline: n === 'online',\n      isDealerList: n === 'dealerList',\n      isDealerIn: n === 'dealerIn',\n      isDealerOut: n === 'dealerOut',\n      isVoc: n === 'voc',\n      isPaid: n === 'paid',\n      isScript: n === 'script',\n      isCapture: n === 'capture',\n      isSched: n === 'sched',\n      isDone: n === 'done',\n      showMap: !!this.state.map,\n      toggleMap: () => this.setState(s => ({ map: !s.map })),\n\n      fitKicker: relocate ? 'Capacity and conditions check' : 'Step 3 — Capacity check',\n      fitNextHint: relocate ? 'Continue to the order details.' : 'Continue to the piping type.',\n      waiverNextLabel: relocate ? 'Next — order details' : 'Next — piping type',\n      captureKicker: relocate ? 'Order details' : 'Step 8 — Order details',\n      schedKicker: relocate ? 'Scheduling' : 'Step 9 — Scheduling',\n\n      isOnlineSource: this.state.buySource === 'online',\n      isDealerSource: this.state.buySource !== 'online',\n\n      toNotReceived: () => this.go('notReceived'),\n      toInsist: () => this.go('insist'),\n      toDeferred: () => this.go('deferred'),\n      toBracket: () => this.go('bracket'),\n      toNoBracket: () => this.go('noBracket'),\n      toFitCheck: () => this.go('fitCheck'),\n      toNotFit: () => this.go('notFit'),\n      toAgreedAlt: () => this.go('agreedAlt'),\n      toWaiver: () => this.go('waiver'),\n      toPipes: () => this.go(relocate ? 'capture' : 'pipes'),\n      toBuried: () => this.go('buried'),\n      toChannel: () => this.go(relocate ? 'capture' : 'channel'),\n      toOnline: () => { this.setState({ buySource: 'online' }); this.go('online', 'free'); },\n      toDealerList: () => { this.setState({ buySource: 'dealer' }); this.go('dealerList'); },\n      toDealerIn: () => this.go('dealerIn'),\n      toDealerOut: () => this.go('dealerOut'),\n      toVoc: () => this.go('voc'),\n      toPaid: () => this.go('paid'),\n      toScriptFree: () => this.go('script', 'free'),\n      toScriptPaid: () => this.go('script', 'paid'),\n      toCapture: () => this.go('capture'),\n      toSched: () => this.go('sched'),\n      toDone: () => this.go('done'),\n\n      isSameHome: this.state.relocateWhere === 'same',\n      isNewHome: this.state.relocateWhere === 'new',\n      relocatePicked: !!this.state.relocateWhere,\n      sameHomeStyle: this.pickBtn(this.state.relocateWhere === 'same'),\n      newHomeStyle: this.pickBtn(this.state.relocateWhere === 'new'),\n      pickSameHome: () => this.setState({ relocateWhere: 'same' }),\n      pickNewHome: () => this.setState({ relocateWhere: 'new' }),\n\n      showDealers: !!this.state.dealersOpen,\n      openDealers: () => this.setState({ dealersOpen: true }),\n      closeDealers: () => this.setState({ dealersOpen: false }),\n      showOrderRules: !!this.state.orderRules,\n      openOrderRules: () => this.setState({ orderRules: true }),\n      closeOrderRules: () => this.setState({ orderRules: false }),\n      showNoCap: !!this.state.noCap,\n      openNoCap: () => this.setState({ noCap: true }),\n      closeNoCap: () => this.setState({ noCap: false }),\n\n      back: () => this.setState(s => s.history.length\n        ? { node: s.history[s.history.length - 1], history: s.history.slice(0, -1) }\n        : s),\n      restart: () => this.setState({ node: 'start', mode: 'free', history: [], serviceMode: '', buySource: '', relocateWhere: '', map: false })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
