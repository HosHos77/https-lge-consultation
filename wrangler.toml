name = "https-lge-consultation"
type = "javascript"
account_id = ""
workers_dev = true
compatibility_date = "2026-09-10"
observability = { enabled = true }

[build]
command = ""
cwd = ""
watch_paths = []

[build.upload]
format = "service-worker"
main = "./index.js"

[[build.upload.rules]]
type = "Text"
globs = ["**/*.txt"]
fallthrough = true

[[build.upload.rules]]
type = "CompiledContentType"
globs = ["**/*.wasm"]
fallthrough = true
