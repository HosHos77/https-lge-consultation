<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أكواد أعطال الغسالات — Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#a50034;--ink:#191a1c;--muted:#697078;--paper:#f5f4f1;--line:#e5e2dc;--white:#fff;--soft:#fff3f6;--green:#176b45}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:'IBM Plex Sans Arabic',sans-serif;color:var(--ink)}.top{background:#151416;color:white;padding:15px clamp(16px,4vw,54px);display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:4}.mark{width:9px;height:38px;border-radius:8px;background:var(--red)}.brand{font:800 19px Cairo}.demo{margin-right:auto;color:#ffd9e3;border:1px solid #6d5b62;padding:5px 12px;border-radius:30px;font-size:11px}.wrap{max-width:1080px;margin:auto;padding:30px 20px 70px}.back{display:inline-block;color:var(--red);text-decoration:none;font-weight:700;margin-bottom:18px}.heading{margin-bottom:20px}.heading h1{font:900 29px Cairo;margin:0 0 5px}.heading p{margin:0;color:var(--muted);line-height:1.8}.layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:18px;align-items:start}.panel,.detail{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.panel{position:sticky;top:86px}.panel h2{font:800 17px Cairo;margin:0 0 12px}.filter{width:100%;padding:12px;border:1px solid #d8d4cd;border-radius:10px;font:14px 'IBM Plex Sans Arabic';margin-bottom:12px}.code-list{display:grid;gap:7px;max-height:65vh;overflow:auto}.code-btn{width:100%;text-align:right;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 12px;cursor:pointer;font:600 13px 'IBM Plex Sans Arabic';color:var(--ink)}.code-btn small{display:block;color:var(--muted);margin-top:3px}.code-btn:hover,.code-btn.active{border-color:var(--red);background:var(--soft)}.detail{min-height:420px}.empty{padding:45px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);font:800 20px Cairo;margin-bottom:8px}.title-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:16px}.code-tag{background:var(--red);color:#fff;border-radius:10px;padding:8px 14px;font:800 17px Cairo}.title-row h2{font:800 21px Cairo;margin:0}.meaning{background:#f8f7f4;border:1px solid var(--line);padding:14px 16px;border-radius:11px;line-height:1.9;margin-bottom:18px}.detail h3{font:800 17px Cairo;margin:18px 0 10px}.steps{display:grid;gap:10px}.step{border:1px solid var(--line);border-radius:11px;padding:14px}.step b{display:block;color:var(--red);margin-bottom:5px}.step p{margin:0;line-height:1.9;color:#45484c}.script{background:#211d1f;color:#fff;border-radius:12px;padding:17px;line-height:2}.script strong{display:block;color:#ffc1d2;margin-bottom:5px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.btn{border:1px solid var(--line);border-radius:9px;padding:10px 15px;background:white;cursor:pointer;font:700 13px 'IBM Plex Sans Arabic';color:var(--ink)}.btn.primary{background:var(--red);color:white;border-color:var(--red)}.service{font-size:12px;background:#fff1f4;color:var(--red);padding:5px 10px;border-radius:20px}@media(max-width:760px){.layout{grid-template-columns:1fr}.panel{position:static}.code-list{grid-template-columns:repeat(2,minmax(0,1fr));max-height:none}.wrap{padding:20px 13px 45px}.heading h1{font-size:24px}}@media(max-width:430px){.code-list{grid-template-columns:1fr}.title-row h2{font-size:18px}}
</style></head><body>
<header class="top"><div class="mark"></div><div><div class="brand">LG Support Center</div><div style="font-size:12px;color:#c7c1c4">Washer Error Codes</div></div><span class="demo">نسخة تجريبية</span></header>
<main class="wrap"><a class="back" href="index.html">← العودة للصفحة الرئيسية</a><div class="heading"><h1>دليل أكواد أعطال الغسالات</h1><p>اختار كود العطل لعرض المعنى والخطوات الإرشادية والسكريبت المقترح للمكالمة.</p></div>
<div class="layout"><aside class="panel"><h2>قائمة الأكواد</h2><input class="filter" id="filter" placeholder="ابحث بالكود أو اسم المشكلة..." type="search"><div class="code-list" id="codeList"></div></aside><section class="detail" id="detail"><div class="empty"><strong>اختار كود العطل</strong>استخدم القائمة أو مربع البحث لعرض تفاصيل الكود.</div></section></div></main>
<script>
const data=[
{code:'IE',name:'خطأ دخول المياه',meaning:'المياه لا تدخل الغسالة أو تدخل ببطء شديد.',steps:[['ضغط المياه في المكان غير كافٍ','التأكد من وجود مياه بتجربة حنفية أخرى في المنزل.'],['حنفية المياه غير مفتوحة بالكامل','فتح الحنفية بالكامل.'],['خرطوم المياه ملتوي','فرد الخرطوم أو إعادة تركيب خرطوم دخول المياه.'],['فلتر خرطوم المياه مسدود','غلق الحنفية وفك وصلة الخرطوم من الغسالة، ثم فحص فلتر صمام الدخول وتنظيفه.']],script:'الرمز ده معناه إن المياه مش داخلة للغسالة أو داخلة ببطء. نتأكد إن الحنفية مفتوحة بالكامل وإن خرطوم المياه مش ملتوي، وبعدها نفحص فلتر دخول المياه — مع غلق الحنفية أولًا.'},
{code:'UE',name:'خطأ عدم توازن الحمل',meaning:'الغسالة تكتشف عدم توازن الحمل؛ فيتوقف العصر أو يتأخر.',steps:[['الملابس غير موزعة بالتساوي','إعادة توزيع الملابس، ثم غلق الباب والضغط على Start/Pause.'],['الحمل صغير جدًا أو قطعة واحدة ثقيلة','إضافة قطعة أو قطعتين مشابهتين أو قطع أصغر لموازنة الحمل.'],['الغسالة غير متزنة على الأرض','التأكد من اتزان الغسالة وأن الأرجل كلها في نفس المستوى.']],script:'الرمز ده معناه إن الملابس مش متوزعة بالتساوي جوه الحلة. نوزع الملابس تاني، ولو فيه قطعة واحدة تقيلة نضيف قطع مناسبة معاها، ونتأكد إن الغسالة متزنة على الأرض.'},
{code:'OE',name:'خطأ تصريف المياه',meaning:'المياه لا تُصرَّف من الغسالة أو تُصرَّف ببطء.',steps:[['خرطوم الصرف ملتوي أو مسدود','تنظيف خرطوم الصرف وفرده.'],['فلتر الصرف مسدود','لو الغسالة فيها مياه، يتم تصريفها أولًا من خرطوم الطوارئ الصغير في طبق أو إناء، ثم فتح الفلتر وتنظيفه وإعادة تركيبه جيدًا.']],script:'الرمز ده معناه إن المياه مش بتتصرف من الغسالة. نتأكد إن خرطوم الصرف مفرود ومش مسدود، وكمان ننظف فلتر الصرف.'},
{code:'DE / DE1 / DE2 / DE4',name:'خطأ الباب',meaning:'الغسالة لا تتعرّف على غلق الباب بشكل سليم.',steps:[['الباب غير مغلق تمامًا','التأكد من غلق الباب بالكامل حتى سماع صوت القفل.'],['شيء يعيق غلق الباب','التأكد من عدم وجود ما يعيق الغلق، مثل حمولة كبيرة أو قطع غسيل كبيرة.']],script:'الرمز ده معناه إن الغسالة مش حاسة إن الباب مقفول تمامًا. نتأكد إن الباب مقفول لآخره ومفيش حاجة معطلة الغلق.'},
{code:'TE',name:'خطأ في مستشعر الحرارة',meaning:'خطأ في مستشعر (حساس) الحرارة.',steps:[['مستشعر الحرارة','فصل الغسالة من الكهرباء وتسجيل طلب صيانة.']],service:true,script:'الرمز ده خاص بمستشعر الحرارة. نفصل الغسالة من الكهرباء، ونسجل لحضرتك زيارة فني.'},
{code:'LE',name:'خطأ توقف الموتور',meaning:'تحميل زائد على الموتور.',steps:[['هل يوجد حمل كبير من الملابس؟','لو نعم: تقليل كمية الملابس وإعادة تشغيل البرنامج. لو لا: الانتقال لخطوة تبريد الموتور.'],['تبريد الموتور','ترك الغسالة 30 دقيقة حتى يبرد الموتور، ثم إعادة تشغيل البرنامج. لو الكود ظهر تاني يتم تسجيل طلب صيانة.']],script:'الرمز ده معناه إن فيه حمل زايد على الموتور. نقلل كمية الملابس لو الحمولة كبيرة، أو نسيب الغسالة 30 دقيقة لحد ما الموتور يبرد وبعدها نجرب تاني.'},
{code:'FE',name:'خطأ زيادة منسوب المياه',meaning:'المياه تزيد عن الحد بسبب احتمال عطل في صمام المياه.',steps:[['احتمال عطل في صمام المياه','غلق حنفية المياه وفصل الغسالة من الكهرباء وتسجيل طلب صيانة.']],service:true,script:'الرمز ده معناه إن المياه بتزيد عن الحد. نقفل حنفية المياه ونفصل الغسالة من الكهرباء فورًا، ونسجل زيارة فني.'},
{code:'PE',name:'خطأ حساس الضغط',meaning:'خلل في حساس منسوب المياه.',steps:[['حساس منسوب المياه','غلق حنفية المياه وفصل الغسالة من الكهرباء وتسجيل طلب صيانة.']],service:true,script:'الرمز ده خاص بحساس منسوب المياه. نقفل الحنفية ونفصل الكهرباء، ونسجل زيارة فني.'},
{code:'VS',name:'خطأ حساس الاهتزاز',meaning:'خلل في حساس الاهتزاز.',steps:[['حساس الاهتزاز','التأكد من أن الغسالة واقفة مستوية وغير ملامسة لأي جسم، ثم تسجيل طلب صيانة.']],service:true,script:'الرمز ده خاص بحساس الاهتزاز. نتأكد إن الغسالة واقفة مستوية ومفيش جهاز آخر ملامس لها، ونسجل زيارة فني.'},
{code:'AE',name:'تسريب مياه داخلي',meaning:'يوجد تسريب مياه داخلي في الجهاز.',steps:[['تسريب مياه داخلي','غلق حنفية المياه وفصل الغسالة من الكهرباء، ثم تسجيل طلب صيانة.']],service:true,script:'الرمز ده معناه إن فيه تسريب مياه من الجهاز. نقفل الحنفية ونفصل الكهرباء، ونسجل زيارة فني.'},
{code:'PF',name:'انقطاع الكهرباء',meaning:'انقطاع في الكهرباء أو تغذية كهربائية غير كافية أثناء التشغيل.',steps:[['انقطاع الكهرباء أثناء البرنامج','الضغط على زر Start/Pause لإعادة تشغيل البرنامج.']],script:'الرمز ده معناه إن الكهرباء انقطعت أثناء البرنامج. نضغط على زر Start/Pause لإعادة تشغيل البرنامج.'},
{code:'DHE',name:'خطأ التجفيف',meaning:'وظائف التجفيف فقط لا تعمل.',steps:[['عطل في وظيفة التجفيف','التنبيه إلى أن باقي وظائف الغسل تعمل بشكل طبيعي، ثم تسجيل طلب صيانة.']],service:true,script:'الرمز ده خاص بوظيفة التجفيف فقط، وباقي وظائف الغسل شغالة عادي. نسجل زيارة فني للتجفيف.'}
];
const list=document.getElementById('codeList'),detail=document.getElementById('detail'),filter=document.getElementById('filter');let active=null;
function renderList(){const q=filter.value.trim().toLowerCase();list.innerHTML='';data.filter(x=>(x.code+' '+x.name).toLowerCase().includes(q)).forEach(x=>{const b=document.createElement('button');b.className='code-btn'+(active===x.code?' active':'');b.innerHTML='<strong>'+x.code+'</strong><small>'+x.name+'</small>';b.onclick=()=>show(x.code,true);list.appendChild(b)})}
function show(code,updateUrl){const x=data.find(i=>i.code===code);if(!x)return;active=code;if(updateUrl)history.replaceState(null,'','?code='+encodeURIComponent(code));renderList();detail.innerHTML='<div class="title-row"><span class="code-tag">'+x.code+'</span><h2>'+x.name+'</h2>'+(x.service?'<span class="service">يتطلب زيارة فني</span>':'')+'</div><div class="meaning"><strong>معنى الكود:</strong><br>'+x.meaning+'</div><h3>خطوات الفحص والإرشاد</h3><div class="steps">'+x.steps.map((s,i)=>'<article class="step"><b>الخطوة '+(i+1)+' — '+s[0]+'</b><p>'+s[1]+'</p></article>').join('')+'</div><h3>سكريبت مقترح للمكالمة</h3><div class="script"><strong>اقرأ للعميل</strong>«'+x.script+'»</div><div class="actions"><button class="btn primary" id="copy">نسخ كود العطل</button><button class="btn" onclick="window.print()">طباعة التفاصيل</button><button class="btn" id="back">العودة لقائمة الأكواد</button></div>';document.getElementById('copy').onclick=()=>navigator.clipboard?.writeText(x.code);document.getElementById('back').onclick=()=>{active=null;history.replaceState(null,'',location.pathname);detail.innerHTML='<div class="empty"><strong>اختار كود العطل</strong>استخدم القائمة لعرض التفاصيل.</div>';renderList()}}
filter.addEventListener('input',renderList);renderList();const requested=new URLSearchParams(location.search).get('code');if(requested&&data.some(x=>x.code===requested))show(requested,false);
</script></body></html>
