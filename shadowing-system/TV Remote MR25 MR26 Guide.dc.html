<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="shadow-nav.js"></script>
<title>ريموت MR25 و MR26 — شرح ومقارنة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#3b3b3b; }
  a { color:#f0a8bd; }
  a:hover { color:#fff; }
</style>
</helmet>
<div dir="rtl" style="min-height:100vh;background:#3b3b3b;color:#f2f2f2;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;">
  <div style="background:#2b2b2b;border-bottom:1px solid #4a4a4a;padding:14px 26px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20;">
    <div style="width:9px;height:30px;background:#A50034;border-radius:2px;flex:none;"></div>
    <div style="font-family:'Cairo',sans-serif;font-weight:900;font-size:17px;">ريموت MR25 و MR26 — شرح ومقارنة</div>
  </div>

  <div style="max-width:1200px;margin:0 auto;padding:28px 28px 90px;display:grid;gap:18px;">
    <div style="background:#2b2b2b;border:1px solid #4a4a4a;border-radius:14px;padding:16px 20px;font-size:15.5px;line-height:1.9;">دوس على أي زرار في الريموت أو من القايمة — هيظهر شرحه على الريموتين. الزراير المختلفة بينهم عليها علامة <strong style="color:#ffb14a;">مختلف</strong>.</div>

    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <sc-for list="{{ filters }}" as="t" hint-placeholder-count="2">
        <button type="button" onClick="{{ t.pick }}" style="{{ t.style }}">{{ t.label }}</button>
      </sc-for>
    </div>

    <div style="display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;">
      <div style="display:flex;gap:22px;flex:none;margin:0 auto;">
        <sc-for list="{{ remotes }}" as="r" hint-placeholder-count="2">
          <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
            <div style="font-family:'Cairo',sans-serif;font-weight:900;font-size:18px;">{{ r.name }}</div>
            <div style="font-size:12.5px;color:#c8cdd0;">{{ r.sub }}</div>
            <div style="position:relative;height:560px;">
              <img src="{{ r.img }}" alt="{{ r.name }}" style="display:block;height:560px;width:auto;border-radius:18px;">
              <sc-for list="{{ r.spots }}" as="p" hint-placeholder-count="13">
                <button type="button" aria-label="{{ p.label }}" onClick="{{ p.pick }}" style="{{ p.style }}"></button>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>

      <div style="flex:1;min-width:300px;display:grid;gap:14px;">
        <div style="{{ cardStyle }}">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;">
            <div style="font-family:'Cairo',sans-serif;font-weight:900;font-size:21px;">{{ cur.ar }}</div>
            <sc-if value="{{ cur.diff }}" hint-placeholder-val="{{ false }}">
              <div style="padding:4px 12px;border-radius:999px;background:#ffb14a;color:#1f1f1f;font-size:12.5px;font-weight:700;">مختلف</div>
            </sc-if>
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;">
            <div style="padding:12px 14px;border-radius:10px;background:#1f1f1f;border:1px solid #4a4a4a;"><div style="font-size:12.5px;color:#f0a8bd;font-weight:700;margin-bottom:4px;">MR25</div><div dir="ltr" style="text-align:right;font-weight:700;font-size:14px;margin-bottom:4px;">{{ cur.en25 }}</div><div style="font-size:14.5px;line-height:1.8;">{{ cur.d25 }}</div></div>
            <div style="padding:12px 14px;border-radius:10px;background:#1f1f1f;border:1px solid #4a4a4a;"><div style="font-size:12.5px;color:#f0a8bd;font-weight:700;margin-bottom:4px;">MR26</div><div dir="ltr" style="text-align:right;font-weight:700;font-size:14px;margin-bottom:4px;">{{ cur.en26 }}</div><div style="font-size:14.5px;line-height:1.8;">{{ cur.d26 }}</div></div>
          </div>
        </div>
        <div style="background:#2b2b2b;border:1px solid #4a4a4a;border-radius:14px;padding:12px;display:grid;gap:6px;">
          <sc-for list="{{ list }}" as="k" hint-placeholder-count="13">
            <button type="button" onClick="{{ k.pick }}" style="{{ k.style }}"><div style="flex:1;text-align:right;">{{ k.ar }}</div><sc-if value="{{ k.diff }}" hint-placeholder-val="{{ false }}"><div style="padding:2px 10px;border-radius:999px;background:#ffb14a;color:#1f1f1f;font-size:11.5px;font-weight:700;">مختلف</div></sc-if></button>
          </sc-for>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const P25={power:[31,7.1],top:[72.5,7.1],hub:[31,15.6],ai:[50,18.2],guide:[72.5,15.6],home:[31,21.6],num:[72.5,21.6],wheel:[50,33.3],back:[31,43],set:[72.5,43],vol:[35,48.3],ch:[66.7,48.3],cp:[50,60.2]};
const P26={power:[27,7.4],top:[69,7.4],hub:[25.9,15.9],ai:[47.1,18.6],guide:[69,15.9],home:[25.9,22.1],num:[69,22.1],wheel:[50,33.6],back:[25.9,43.3],set:[69,43.3],vol:[34.5,48.6],ch:[63.2,48.6],cp:[50,60]};
const K=[
 { k:'top', ar:'الزرار اللي فوق على اليمين', diff:true, en25:'Easy Guide (Accessibility & Chatbot)', d25:'إمكانية الوصول والمساعد (Chatbot) — بيفتح إعدادات إمكانية الوصول والمساعدة.', en26:'Custom Key ♡', d26:'زرار مخصص — العميل يقدر يربطه بالتطبيق أو الوظيفة اللي بيستخدمها كتير.' },
 { k:'cp', ar:'أزرار اختصار التطبيقات (CP)', diff:true, en25:'Netflix · Prime Video · Disney+ · LG Channels · Sling · Alexa', d25:'اختصارات مباشرة للتطبيقات دي.', en26:'Netflix · Prime Video · Disney+ · LG Channels · News · YouTube', d26:'اختصارات مباشرة للتطبيقات دي — فيها News و YouTube بدل Sling و Alexa.' },
 { k:'hub', ar:'Home Hub', diff:false, en25:'Home Hub (long press: Input)', d25:'لوحة معلومات المنزل — ضغطة مطوّلة بتفتح المدخلات.', en26:'Home Hub (long press: Input)', d26:'نفس الوظيفة.' },
 { k:'ai', ar:'زرار الذكاء الاصطناعي', diff:false, en25:'Integrated AI voice recognition', d25:'ضغطة مطوّلة للبحث الصوتي والأوامر بالذكاء الاصطناعي.', en26:'Integrated AI voice recognition', d26:'نفس الوظيفة.' },
 { k:'power', ar:'التشغيل / الإطفاء', diff:false, en25:'Power', d25:'تشغيل وإطفاء الشاشة.', en26:'Power', d26:'نفس الوظيفة.' },
 { k:'guide', ar:'Guide', diff:false, en25:'Guide', d25:'ضغطة مطوّلة: قايمة القنوات.', en26:'Guide', d26:'نفس الوظيفة.' },
 { k:'home', ar:'الصفحة الرئيسية', diff:false, en25:'Home', d25:'بيفتح الصفحة الرئيسية.', en26:'Home', d26:'نفس الوظيفة.' },
 { k:'num', ar:'قايمة الأرقام', diff:false, en25:'Number key', d25:'بيظهر لوحة الأرقام على الشاشة.', en26:'Number key', d26:'نفس الوظيفة.' },
 { k:'wheel', ar:'العجلة / OK', diff:false, en25:'Wheel (OK)', d25:'التنقل والتأكيد والتحكم في المؤشر.', en26:'Wheel (OK)', d26:'نفس الوظيفة.' },
 { k:'back', ar:'الرجوع', diff:false, en25:'Back', d25:'الرجوع للشاشة اللي قبلها.', en26:'Back', d26:'نفس الوظيفة.' },
 { k:'set', ar:'الإعدادات', diff:false, en25:'Setting: Quick Setting', d25:'الإعدادات السريعة — 3 ضغطات تظهر معلومات الشاشة.', en26:'Setting: Quick Setting', d26:'نفس الوظيفة.' },
 { k:'vol', ar:'الصوت', diff:false, en25:'Volume (Tilt)', d25:'تغيير الصوت — ضغطة مطوّلة لتحت: كتم الصوت.', en26:'Volume (Tilt)', d26:'نفس الوظيفة.' },
 { k:'ch', ar:'القنوات', diff:false, en25:'Channel (Tilt)', d25:'تغيير القنوات.', en26:'Channel (Tilt)', d26:'نفس الوظيفة.' }
];
class Component extends DCLogic {
  state = { sel:'top', only:false };
  renderVals() {
    const s = this.state, cur = K.find(x => x.k === s.sel);
    const shown = K.filter(x => !s.only || x.diff);
    const spot = (P, x) => ({ label:x.ar, pick:() => this.setState({ sel:x.k }), style:{ position:'absolute', left:P[x.k][0]+'%', top:P[x.k][1]+'%', width: x.k === 'cp' ? '120px' : (x.k === 'wheel' ? '70px' : '32px'), height: x.k === 'cp' ? '80px' : (x.k === 'wheel' ? '70px' : '32px'), transform:'translate(-50%,-50%)', borderRadius: x.k === 'cp' ? '14px' : '50%', padding:0, cursor:'pointer', background: s.sel === x.k ? 'rgba(232,0,90,.28)' : 'transparent', border: s.sel === x.k ? '3px solid #e8005a' : (x.diff ? '2px dashed #ffb14a' : '2px solid transparent'), boxShadow: s.sel === x.k ? '0 0 16px rgba(232,0,90,.9)' : 'none' } });
    return {
      filters: [['كل الزراير', false], ['الزراير المختلفة بس', true]].map(([label, v]) => ({ label, pick: () => this.setState(p => ({ only:v, sel: v && !K.find(x => x.k === p.sel).diff ? 'top' : p.sel })), style:{ padding:'9px 18px', borderRadius:'999px', cursor:'pointer', fontFamily:"'Cairo',sans-serif", fontWeight:700, fontSize:'14px', color:'#fff', border: s.only === v ? '1px solid #e8005a' : '1px solid #565656', background: s.only === v ? '#A50034' : '#2b2b2b' } })),
      remotes: [ { name:'MR25', sub:'Easy Guide', img:'assets/mr25-remote.png', spots: shown.map(x => spot(P25, x)) }, { name:'MR26', sub:'Custom Key ♡', img:'assets/mr26-remote.png', spots: shown.map(x => spot(P26, x)) } ],
      cur,
      cardStyle:{ background:'#2b2b2b', borderRadius:'14px', padding:'18px 20px', border: cur.diff ? '2px solid #ffb14a' : '1px solid #4a4a4a' },
      list: shown.map(x => ({ ...x, pick: () => this.setState({ sel:x.k }), style:{ display:'flex', alignItems:'center', gap:'10px', width:'100%', padding:'10px 14px', borderRadius:'10px', cursor:'pointer', fontFamily:"'IBM Plex Sans Arabic',sans-serif", fontSize:'14.5px', color:'#fff', border: s.sel === x.k ? '1px solid #e8005a' : '1px solid transparent', background: s.sel === x.k ? '#3a2330' : 'transparent' } }))
    };
  }
}
</script>
</body>
</html>
