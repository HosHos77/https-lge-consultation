<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Consultation Shadowing System</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; background:#111314; overflow:hidden; }
  a { color:#A50034; }
  a:hover { color:#7d0027; }
</style>
</helmet>
<div style="height:100vh;display:flex;flex-direction:column;background:#111314;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;">
  <div dir="ltr" style="flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;background:#1b1e20;border-bottom:1px solid #2a2f32;">
    <button type="button" onClick="{{ back }}" title="رجوع" style="width:38px;height:36px;border-radius:9px;border:1px solid #33393c;background:#22272a;color:#e4e7e9;font-size:18px;cursor:pointer;" style-hover="background:#2d3337;">←</button>
    <button type="button" onClick="{{ forward }}" title="للأمام" style="width:38px;height:36px;border-radius:9px;border:1px solid #33393c;background:#22272a;color:#e4e7e9;font-size:18px;cursor:pointer;" style-hover="background:#2d3337;">→</button>
    <button type="button" onClick="{{ reload }}" title="تحديث" style="width:38px;height:36px;border-radius:9px;border:1px solid #33393c;background:#22272a;color:#e4e7e9;font-size:17px;cursor:pointer;" style-hover="background:#2d3337;">↻</button>
    <button type="button" onClick="{{ home }}" title="الصفحة الرئيسية" style="height:36px;padding:0 14px;border-radius:9px;border:1px solid #A50034;background:#A50034;color:#fff;font-family:'Cairo',sans-serif;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap;" style-hover="background:#7d0027;">⌂ الرئيسية</button>
    <div dir="rtl" style="flex:1;min-width:0;height:36px;display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:999px;background:#0d0f10;border:1px solid #2a2f32;color:#c8cdd0;font-size:13.5px;">
      <div style="width:7px;height:7px;border-radius:50%;background:#A50034;flex:none;"></div>
      <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ title }}</div>
    </div>
  </div>
  <iframe ref="{{ frameRef }}" src="Installation Guide Home.dc.html" onLoad="{{ onLoad }}" style="flex:1;width:100%;border:0;background:#f4f3ef;"></iframe>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { title: 'الرئيسية' };
  frameRef = React.createRef();
  win() { const f = this.frameRef.current; return f && f.contentWindow; }
  renderVals() {
    return {
      frameRef: this.frameRef,
      title: this.state.title,
      back: () => { try { this.win().history.back(); } catch (e) {} },
      forward: () => { try { this.win().history.forward(); } catch (e) {} },
      reload: () => { try { this.win().location.reload(); } catch (e) {} },
      home: () => { try { this.win().location.href = new URL('Installation Guide Home.dc.html', location.href).href; } catch (e) { this.frameRef.current.src = 'Installation Guide Home.dc.html'; } },
      onLoad: () => {
        try {
          const w = this.win();
          const t = w.document.title || decodeURIComponent(w.location.pathname.split('/').pop().replace('.dc.html', ''));
          this.setState({ title: t });
          const obs = new MutationObserver(() => this.setState({ title: w.document.title }));
          const tt = w.document.querySelector('title'); if (tt) obs.observe(tt, { childList: true });
        } catch (e) {}
      }
    };
  }
}
</script>
</body>
</html>
