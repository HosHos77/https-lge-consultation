<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="shadow-nav.js"></script>
<title>شرح ريموت تكييف هيرو</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#f4f3ef; }
  a { color:#A50034; }
  a:hover { color:#7d0027; }
</style>
</helmet>
<div dir="rtl" style="min-height:100vh;background:#f4f3ef;color:#191a1c;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;">
  <div style="background:#111314;color:#f4f3ef;padding:16px 28px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20;">
    <div style="width:9px;height:32px;background:#A50034;border-radius:2px;flex:none;"></div>
    <div style="font-family:'Cairo',sans-serif;font-weight:900;font-size:18px;">شرح ريموت تكييف هيرو</div>
  </div>

  <div style="max-width:1080px;margin:0 auto;padding:28px 28px 90px;display:grid;gap:18px;">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;">
      <button type="button" onClick="{{ pickSwing }}" style="text-align:right;padding:16px 20px;border-radius:14px;border:2px solid #A50034;background:#fff5f7;cursor:pointer;font-family:'IBM Plex Sans Arabic',sans-serif;">
        <div style="font-family:'Cairo',sans-serif;font-weight:900;font-size:17px;color:#A50034;margin-bottom:6px;">تشغيل الـ Swing (حركة الريشة)</div>
        <div style="font-size:14.5px;line-height:1.8;">رأسي: زرار <strong>V-SWING</strong>. أفقي: زرار <strong>FUNCTION</strong> واختار آخر اختيار (اتجاه الهوا الأفقي).</div>
      </button>
      <button type="button" onClick="{{ pickPlasma }}" style="text-align:right;padding:16px 20px;border-radius:14px;border:2px solid #A50034;background:#fff5f7;cursor:pointer;font-family:'IBM Plex Sans Arabic',sans-serif;">
        <div style="font-family:'Cairo',sans-serif;font-weight:900;font-size:17px;color:#A50034;margin-bottom:6px;">تشغيل البلازما أيونايزر</div>
        <div style="font-size:14.5px;line-height:1.8;">زرار <strong>FUNCTION</strong> واختار <strong>Health</strong> (علامة الورقة).</div>
      </button>
    </div>

    <div style="font-size:15px;color:#6b7075;">دوس على أي زرار في الريموت عشان تعرف وظيفته.</div>

    <div style="display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap;">
      <div style="position:relative;width:260px;flex:none;margin:0 auto;">
        <img src="assets/hero-remote.png" alt="ريموت هيرو" style="display:block;width:260px;height:auto;">
        <sc-for list="{{ spots }}" as="p" hint-placeholder-count="12">
          <button type="button" aria-label="{{ p.label }}" onClick="{{ p.pick }}" style="{{ p.style }}"></button>
        </sc-for>
      </div>
      <div style="flex:1;min-width:280px;display:grid;gap:14px;">
        <div style="background:#fff;border:1px solid #f0c2ce;border-radius:14px;padding:22px 24px;">
          <div dir="ltr" style="text-align:right;font-family:'Cairo',sans-serif;font-weight:900;font-size:20px;color:#A50034;">{{ cur.en }}</div>
          <div style="font-family:'Cairo',sans-serif;font-weight:700;font-size:19px;margin:2px 0 10px;">{{ cur.ar }}</div>
          <sc-if value="{{ hasIcon }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;"><div style="font-size:13px;color:#6b7075;">الرمز على الشاشة:</div><img src="{{ icon }}" alt="" style="height:34px;width:auto;mix-blend-mode:multiply;border:1px solid #e3e0d8;border-radius:6px;"></div></sc-if>
          <div style="font-size:15.5px;line-height:1.9;">{{ cur.d }}</div>
        </div>
        <sc-if value="{{ hasSub }}" hint-placeholder-val="{{ false }}">
          <div style="background:#fff;border:1px solid #e3e0d8;border-radius:14px;padding:14px 16px;display:grid;gap:6px;">
            <div style="font-size:13px;font-weight:700;color:#6b7075;">{{ subTitle }}</div>
            <sc-for list="{{ sub }}" as="s" hint-placeholder-count="5">
              <div style="{{ s.style }}"><img src="{{ s.img }}" alt="" style="height:28px;width:auto;flex:none;mix-blend-mode:multiply;"><div style="font-weight:700;min-width:120px;">{{ s.a }}</div><div>{{ s.b }}</div></div>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{ hasScript }}" hint-placeholder-val="{{ false }}">
          <div style="background:#1c1a1b;color:#f6f1f2;border-radius:12px;padding:16px 20px;">
            <div style="font-size:12.5px;color:#f0a8bd;margin-bottom:6px;font-weight:600;">قول للعميل</div>
            <div style="font-family:'Cairo',sans-serif;font-size:17px;line-height:2;">{{ cur.script }}</div>
          </div>
        </sc-if>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const P={"onoff":[31.8,48.4],"mode":[77.3,48.4],"vswing":[55.5,57.9],"speed":[55.5,67.4],"left":[30.5,67.4],"right":[80.5,67.4],"turbo":[55.5,76.4],"func":[32.7,85.9],"cancel":[78.6,85.9],"timer":[30.5,93.6],"eco":[55.5,93.6],"display":[80.5,93.6]};
const K={
 onoff:{en:'ON/OFF',ar:'تشغيل / إطفاء',d:'بيشغّل التكييف أو يطفيه.'},
 mode:{en:'MODE',ar:'وضع التشغيل',d:'كل ضغطة بتنقل للوضع اللي بعده:',sub:[['تبريد (COOL)','لاختيار وضع التبريد.','cool'],['تجفيف (DRY)','لاختيار وضع إزالة الرطوبة.','dry'],['مروحة (FAN)','لاختيار وضع المروحة.','fan'],['تدفئة (HEAT)','لاختيار وضع التدفئة.','heat'],['أوتوماتيك (AUTO)','لاختيار الوضع الأوتوماتيك.','auto']],subTitle:'الأوضاع'},
 vswing:{icon:'vswing',icon2:1,en:'V-SWING',ar:'حركة الريشة الرأسية',d:'بيحرّك اتجاه الهوا لفوق ولتحت.',script:'«عشان الريشة تتحرك لفوق وتحت، دوس زرار V-SWING.»'},
 speed:{icon:'speed',en:'SPEED',ar:'سرعة المروحة',d:'بيغيّر سرعة المروحة.'},
 left:{icon:'temp',en:'<',ar:'تقليل الحرارة',d:'بيقلل درجة الحرارة المطلوبة في وضع التبريد أو التدفئة أو التجفيف أو الأوتوماتيك (من 20° لـ 28°).'},
 right:{icon:'temp',en:'>',ar:'رفع الحرارة',d:'بيرفع درجة الحرارة المطلوبة في وضع التبريد أو التدفئة أو التجفيف أو الأوتوماتيك (من 20° لـ 28°).'},
 turbo:{icon:'turbo',en:'TURBO',ar:'تبريد / تدفئة سريعة',d:'بيغيّر حرارة الأوضة بسرعة.'},
 func:{en:'FUNCTION',ar:'الوظايف الإضافية',d:'كل ضغطة بتنقل لوظيفة من دول:',sub:[['النوم (Sleep)','لتشغيل وضع النوم.','sleep',1],['التنظيف الذاتي (Self-Clean)','لتشغيل التنظيف الذاتي.','clean',1],['الوضع الهادي (Quiet)','لتشغيل الوضع الهادي.','quiet',1],['Health — البلازما أيونايزر','لتشغيل البلازما أيونايزر.','health',1],['الريشة الأفقية','لتحريك اتجاه الهوا يمين وشمال — آخر اختيار.','horiz',1]],subTitle:'الوظايف (بالترتيب)',script:'«دوس FUNCTION لحد ما توصل للوظيفة اللي عايزها — Health للبلازما، وآخر اختيار لحركة الريشة يمين وشمال.»'},
 cancel:{en:'CANCEL',ar:'إلغاء',d:'بيلغي الوظيفة أو الإعداد اللي اتعمل.'},
 timer:{icon:'timer',icon2:1,en:'TIMER',ar:'التايمر',d:'بيشغّل أو يطفي التكييف أوتوماتيك في الوقت اللي تحدده.'},
 eco:{icon:'eco',en:'ECO',ar:'توفير الكهربا',d:'بيشغّل وضع ECO لتوفير الطاقة.'},
 display:{en:'DISPLAY',ar:'شاشة الوحدة الداخلية',d:'بيشغّل أو يطفي شاشة الوحدة الداخلية.'}
};
class Component extends DCLogic {
  state = { sel:'func', hl:null };
  renderVals() {
    const s = this.state, cur = K[s.sel];
    return {
      cur, hasScript: !!cur.script, hasSub: !!cur.sub, subTitle: cur.subTitle || '',
      hasIcon: !!cur.icon, icon: 'assets/' + (cur.icon2 ? 'hr2-' : 'hr-') + (cur.icon || 'cool') + '.png',
      sub: (cur.sub || []).map(([a,b,ic,v2], i) => ({ a, b, img: 'assets/' + (v2 ? 'hr2-' : 'hr-') + ic + '.png', style:{ display:'flex', alignItems:'center', gap:'12px', flexWrap:'wrap', padding:'8px 12px', borderRadius:'8px', fontSize:'14.5px', lineHeight:1.7, background: s.hl === i ? '#fde7ee' : '#faf9f6', border: s.hl === i ? '1px solid #A50034' : '1px solid transparent' } })),
      spots: Object.keys(P).map(k => ({ label:K[k].en, pick:() => this.setState({ sel:k, hl:null }), style:{ position:'absolute', left:P[k][0]+'%', top:P[k][1]+'%', width: k === 'speed' ? '46px' : '54px', height: k === 'speed' ? '46px' : '30px', transform:'translate(-50%,-50%)', borderRadius: k === 'speed' ? '50%' : '14px', padding:0, cursor:'pointer', background: s.sel === k ? 'rgba(165,0,52,.18)' : 'transparent', border: s.sel === k ? '3px solid #A50034' : '2px solid transparent', boxShadow: s.sel === k ? '0 0 14px rgba(165,0,52,.6)' : 'none' } })),
      pickSwing: () => this.setState({ sel:'func', hl:4 }),
      pickPlasma: () => this.setState({ sel:'func', hl:3 })
    };
  }
}
</script>
</body>
</html>
