<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="shadow-nav.js"></script>
<title>دعم فني — الوحدة الخارجية مش بتشتغل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#f4f3ef; }
  a { color:#A50034; }
  a:hover { color:#7d0027; }
</style>
</helmet>
<div dir="rtl" style="min-height:100vh;background:#f4f3ef;color:#191a1c;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;">
  <div style="background:#111314;color:#f4f3ef;padding:16px 28px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20;">
    <div style="width:9px;height:32px;background:#A50034;border-radius:2px;flex:none;"></div>
    <div style="font-family:'Cairo',sans-serif;font-weight:900;font-size:18px;">الوحدة الخارجية مش بتشتغل</div>
    <div style="margin-right:auto;padding:6px 14px;border-radius:999px;background:#22282a;font-size:12.5px;color:#c8cdd0;">{{ badge }}</div>
  </div>

  <div style="max-width:900px;margin:0 auto;padding:28px 28px 90px;display:grid;gap:14px;">
    <sc-for list="{{ trail }}" as="t" hint-placeholder-count="0">
      <div style="display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:12px;background:#fff;border:1px solid #e3e0d8;">
        <div style="flex:none;width:26px;height:26px;border-radius:50%;background:#eeebe4;color:#6b7075;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;">{{ t.n }}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:14px;color:#6b7075;line-height:1.7;">{{ t.q }}</div>
          <div style="font-weight:700;font-size:14.5px;color:#A50034;margin-top:2px;">← {{ t.a }}</div>
        </div>
      </div>
    </sc-for>

    <div style="{{ cardStyle }}">
      <div style="font-size:12.5px;font-weight:700;color:#A50034;margin-bottom:8px;">{{ kind }}</div>
      <div style="background:#1c1a1b;color:#f6f1f2;border-radius:12px;padding:18px 22px;margin-bottom:16px;">
        <div style="font-size:12.5px;color:#f0a8bd;margin-bottom:8px;font-weight:600;">{{ sayLabel }}</div>
        <div style="font-family:'Cairo',sans-serif;font-size:18px;line-height:2;">{{ cur.say }}</div>
      </div>
      <sc-if value="{{ hasSteps }}" hint-placeholder-val="{{ false }}">
        <div style="display:grid;gap:10px;margin-bottom:16px;">
          <sc-for list="{{ steps }}" as="s" hint-placeholder-count="2">
            <div style="display:flex;gap:12px;align-items:flex-start;font-size:15.5px;line-height:1.85;">
              <div style="flex:none;width:28px;height:28px;border-radius:50%;background:#A50034;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Cairo',sans-serif;font-weight:700;font-size:14px;">{{ s.n }}</div>
              <div style="flex:1;">{{ s.t }}</div>
            </div>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{ hasNote }}" hint-placeholder-val="{{ false }}">
        <div style="padding:12px 16px;border-radius:10px;background:#fdecee;border:2px solid #c8102e;color:#8a0c20;font-weight:600;font-size:15px;line-height:1.8;margin-bottom:16px;">{{ cur.note }}</div>
      </sc-if>
      <div style="display:grid;gap:10px;">
        <sc-for list="{{ answers }}" as="a" hint-placeholder-count="2">
          <button type="button" onClick="{{ a.go }}" style="{{ a.style }}">{{ a.label }}</button>
        </sc-for>
        <sc-if value="{{ isEsc }}" hint-placeholder-val="{{ false }}">
          <a href="AC Not Working.dc.html#esc" style="display:block;text-align:right;padding:16px 20px;border-radius:12px;background:#A50034;color:#fff;font-family:'Cairo',sans-serif;font-weight:700;font-size:17px;text-decoration:none;">تسجيل طلب صيانة ←</a>
        </sc-if>
      </div>
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <sc-if value="{{ canBack }}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{ back }}" style="padding:10px 18px;border-radius:10px;border:1px solid #d9d5cb;background:#fff;cursor:pointer;font-family:'Cairo',sans-serif;font-weight:700;font-size:14px;">رجوع خطوة</button>
      </sc-if>
      <sc-if value="{{ canBack }}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{ restart }}" style="padding:10px 18px;border-radius:10px;border:1px solid #d9d5cb;background:#fff;cursor:pointer;font-family:'Cairo',sans-serif;font-weight:700;font-size:14px;">ابدأ من الأول</button>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const N = {
  q1: { say:'«ممكن حضرتك تبص على شاشة الريموت — التكييف شغال على أي وضع؟ في علامة المروحة؟»',
    a:[['أيوه على وضع المروحة (Fan)','endFan'],['لأ، على تبريد أو تدفئة','qTemp']] },
  qTemp: { say:'«الأوضة وصلت لدرجة الحرارة اللي حضرتك مظبّطها على الريموت؟»',
    steps:['بص على الدرجة المظبوطة على الريموت.','اعرف حرارة الأوضة بزرار ROOM TEMP في الريموت.'],
    a:[['أيوه، الأوضة وصلت للدرجة','endTemp'],['لأ، لسه الأوضة حر','qShort']] },
  qShort: { say:'«حضرتك قفلت التكييف وشغّلته تاني بسرعة، أو بيشتغل ويطفي في وقت قصير؟»',
    a:[['أيوه','endShort'],['لأ','endEsc']] },
  endFan: { end:'ok', say:'«ده طبيعي يا فندم — في وضع المروحة الوحدة الخارجية مش بتشتغل، والتكييف بيحرّك الهوا بس من غير تبريد. عشان يبرّد، دوس MODE واختار التبريد.»',
    steps:['في وضع المروحة مينفعش تظبط درجة الحرارة — بتتظبط أوتوماتيك.','حرارة الأوضة مش بتظهر على الشاشة الصغيرة.'] },
  endTemp: { end:'ok', say:'«ده طبيعي — لما الأوضة توصل للدرجة المظبوطة، الوحدة الخارجية بتفصل لوحدها وترجع تشتغل لما الحرارة تعلى. لو عايز الأوضة أبرد، وطّي الدرجة على الريموت.»' },
  endShort: { end:'ok', say:'«ده طبيعي — لحماية الكمبروسر، لو التكييف اتقفل واشتغل على طول، الوحدة الخارجية مش هتشتغل غير بعد ٣ دقايق، وبعدها الهوا البارد هيطلع من الوحدة الداخلية.»',
    steps:['اطفي التكييف واستنى ٣ دقايق، وبعدين شغّله.'] },
  endOk: { end:'ok', say:'«تمام، الحمد لله اتحلت. أي خدمة تانية أقدر أساعد حضرتك فيها؟»' },
  endEsc: { end:'esc', say:'«المشكلة محتاجة فني يكشف عليها. هسجّل لحضرتك طلب صيانة دلوقتي.»' }
};
const AR = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
class Component extends DCLogic {
  state = { node:'q1', path:[] };
  renderVals() {
    const s = this.state, cur = N[s.node];
    const go = (label, to) => () => this.setState(p => ({ node:to, path:[...p.path, { from:p.node, a:label }] }));
    const isEnd = !!cur.end;
    return {
      badge: isEnd ? (cur.end === 'ok' ? 'اتحلت' : 'تسجيل طلب صيانة') : `سؤال ${AR[s.path.length + 1] || s.path.length + 1}`,
      trail: s.path.map((p, i) => ({ n: AR[i + 1] || i + 1, q: N[p.from].say, a: p.a })),
      cur, kind: isEnd ? (cur.end === 'ok' ? '✓ المشكلة اتحلت' : 'النتيجة — سجّل طلب صيانة') : 'سؤال ' + (AR[s.path.length + 1] || s.path.length + 1),
      sayLabel: isEnd ? 'قول للعميل' : 'اسأل العميل',
      hasSteps: !!(cur.steps && cur.steps.length), steps: (cur.steps || []).map((t, i) => ({ n: AR[i + 1], t })),
      hasNote: !!cur.note,
      answers: (cur.a || []).map(([label, to]) => ({ label, go: go(label, to), style:{ textAlign:'right', padding:'16px 20px', borderRadius:'12px', cursor:'pointer', fontFamily:"'Cairo',sans-serif", fontWeight:700, fontSize:'16px', border:'1px solid #e3e0d8', background:'#fff', color:'#191a1c' } })),
      isEsc: cur.end === 'esc',
      cardStyle:{ background:'#fff', borderRadius:'14px', padding:'24px 26px', border: cur.end === 'ok' ? '2px solid #2f6b4f' : (cur.end === 'esc' ? '2px solid #A50034' : '1px solid #e3e0d8'), borderTop:'4px solid ' + (cur.end === 'ok' ? '#2f6b4f' : '#A50034') },
      canBack: s.path.length > 0,
      back: () => this.setState(p => { const path = p.path.slice(0, -1); return { node: p.path[p.path.length - 1].from, path }; }),
      restart: () => this.setState({ node:'q1', path:[] })
    };
  }
}
</script>
</body>
</html>
